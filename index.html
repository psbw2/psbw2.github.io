orms always apply equally to every population","The athlete's score becomes mathematically invalid"],"correct":0,"why":"Reference populations need to match relevant participant characteristics and test protocols.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new3","n":174},{"id":"original-mock-175","topic":"A3.2","stem":"What is the key limitation of correlational evidence for test selection?","options":["That measurement units should be reported","That improving the jump score will necessarily cause faster sprinting","That a numerical association can be calculated","That the two variables covary in the sample"],"correct":1,"why":"Correlation does not establish causality or transfer from a specific intervention.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new3","n":175},{"id":"original-mock-176","topic":"B2.2","stem":"What is a key safety requirement for heavy bench pressing?","options":["Removing all rack safety devices","Closing eyes during the lift","Using a thumbless grip without safeguards","Competent spotting or safety bars where suitable"],"correct":3,"why":"Suitable spotting or safeties reduce risk if a lifter fails a repetition.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new5","n":176},{"id":"original-mock-177","topic":"B2.2","stem":"Which joint action is central during the pressing phase of a bench press?","options":["Shoulder horizontal abduction","Ankle dorsiflexion","Horizontal adduction","Hip internal rotation"],"correct":2,"why":"Pectoralis major contributes to shoulder horizontal adduction during pressing.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new3","n":177},{"id":"original-mock-178","topic":"B2.2","stem":"What is the dominant elbow action as a bench press bar is driven upward?","options":["Abduction","Extension","Pronation only","Flexion"],"correct":1,"why":"The triceps extend the elbow during the press phase.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new4","n":178},{"id":"original-mock-179","topic":"B2.2","stem":"Why should the upper back be braced on a bench press?","options":["Lift the feet off the ground for all repetitions","Keep the shoulders completely loose","Create a stable upper-body base","Maximise uncontrolled spinal rotation"],"correct":2,"why":"Stable scapular and trunk positioning helps safe and repeatable force production.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new4","n":179},{"id":"original-mock-180","topic":"B2.2","stem":"What should a bent-over row chiefly train?","options":["Elbow extension as the sole prime mover","Vertical jumping","Horizontal pulling with shoulder extension and scapular retraction","Hip abduction without arm movement"],"correct":2,"why":"Rows involve pulling through the shoulders and elbows while stabilising the trunk.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new6","n":180},{"id":"original-mock-181","topic":"B2.2","stem":"Which common row fault increases unwanted spinal loading risk?","options":["Loss of stable trunk position and momentum compensation","Neutral breathing between reps","Smooth scapular motion","Controlled elbow flexion"],"correct":0,"why":"Maintaining a controlled trunk limits unwanted compensation and helps target pulling muscles.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new6","n":181},{"id":"original-mock-182","topic":"B2.2","stem":"What is an appropriate initial correction if a bench press bar path becomes uncontrollable?","options":["Increase load immediately","Continue despite repeated unsafe failures","Reduce load and restore a controlled movement pattern","Remove the spotter"],"correct":2,"why":"Technical consistency and safety come before progressing load.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new3","n":182},{"id":"original-mock-183","topic":"B2.2","stem":"Which grip strategy is generally safer for a free-weight bench press?","options":["Only fingertips contacting the bar","Open thumbless grip for all lifters","No contact between palm and bar","Closed grip with thumb around the bar"],"correct":3,"why":"A closed grip helps reduce risk of the bar rolling from the hands.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new6","n":183},{"id":"original-mock-184","topic":"B2.2","stem":"Which muscle group contributes strongly to bent-over rowing?","options":["Quadriceps only","Tibialis anterior only","Gastrocnemius only","Latissimus dorsi"],"correct":3,"why":"Latissimus dorsi and upper-back muscles assist rowing while elbow flexors contribute.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new5","n":184},{"id":"original-mock-185","topic":"B2.3","stem":"What is static stretching?","options":["Plyometric hopping","Static stretching","Agility training","Ballistic stretching"],"correct":1,"why":"Static stretching involves maintaining a stretch position over time.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new3","n":185},{"id":"original-mock-186","topic":"B2.3","stem":"What is dynamic stretching?","options":["PNF contract-relax only","Dynamic stretching","Passive static holds only","Maximal strength training only"],"correct":1,"why":"Dynamic stretching moves joints through controlled ranges of motion.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new3","n":186},{"id":"original-mock-187","topic":"B2.3","stem":"What does PNF stand for in flexibility training?","options":["Progressive neural force","Power neuromuscular frequency","Passive normal flexibility","Proprioceptive neuromuscular facilitation"],"correct":3,"why":"PNF methods pair stretching and muscular contraction strategies.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new6","n":187},{"id":"original-mock-188","topic":"B2.3","stem":"What is the purpose of the warm-up before maximal sprinting?","options":["Progressively raise temperature and prepare sport-specific neuromuscular activity","Eliminate all pre-activation work","Hold long stretches as the sole preparation","Induce exhaustive fatigue first"],"correct":0,"why":"Warm-ups prepare physiological and movement systems while minimising undue fatigue.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new4","n":188},{"id":"original-mock-189","topic":"B2.3","stem":"What is continuous aerobic training?","options":["Repetition sprint training","Plyometric training","Continuous training","Cluster sets"],"correct":2,"why":"Continuous aerobic training sustains exercise for a relatively extended period.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new3","n":189},{"id":"original-mock-190","topic":"B2.3","stem":"What is interval training?","options":["Passive stretching alone","Interval training","Constant continuous activity","Isolated 1RM testing"],"correct":1,"why":"Interval training alternates defined exercise and recovery segments.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new5","n":190},{"id":"original-mock-191","topic":"B2.3","stem":"Which adaptation helps repeated high-intensity exercise recovery?","options":["Aerobic oxidative capacity","Elimination of all blood flow to muscle","Only maximal flexibility","Complete loss of mitochondrial enzymes"],"correct":0,"why":"Aerobic capacity supports substrate replenishment and between-bout recovery.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new6","n":191},{"id":"original-mock-192","topic":"B2.3","stem":"What is a principal limitation of very long static holds immediately before explosive actions?","options":["Guaranteed large increase in explosive power","Potential transient reductions in force or power in some circumstances","Instant bone remodelling","Complete elimination of injury risk"],"correct":1,"why":"Prolonged static stretching can transiently impair explosive outputs depending on dose and context.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new5","n":192},{"id":"original-mock-193","topic":"B2.3","stem":"What does aerobic exercise intensity usually depend on?","options":["Forearm pronation","Relative exercise intensity","Resting bone density","Grip width"],"correct":1,"why":"Relative speed or physiological thresholds help prescribe endurance intensity.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new4","n":193},{"id":"original-mock-194","topic":"C3.3","stem":"What is the UK GDPR principle of data minimisation?","options":["Unlimited data retention","Data minimisation","Public release by default","Involuntary disclosure"],"correct":1,"why":"Personal data should be adequate, relevant and limited to what is necessary.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new4","n":194},{"id":"original-mock-195","topic":"C3.3","stem":"How should athlete performance data access generally be managed?","options":["Posting identifiable results publicly by default","Open access to every staff and fan","Shared passwords across all users","Role-based access restricted to authorised staff"],"correct":3,"why":"Access should be limited to legitimate needs with appropriate controls.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new4","n":195},{"id":"original-mock-196","topic":"C3.3","stem":"What is the purpose limitation principle under UK GDPR?","options":["Permanent publication of records","Specified explicit legitimate purposes and compatible further use","Unrestricted repurposing without thought","No need for a lawful basis"],"correct":1,"why":"Purpose limitation constrains subsequent uses of personal data.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new6","n":196},{"id":"original-mock-197","topic":"C3.3","stem":"Which principle requires retaining identifiable data no longer than necessary?","options":["Maximum data collection","Involuntary publication","Storage limitation","Unrestricted transfer"],"correct":2,"why":"Data should not be kept in identifiable form longer than needed for legitimate purposes.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new6","n":197},{"id":"original-mock-198","topic":"C3.3","stem":"Why should data-security incidents be reported through a club's procedures?","options":["Ignore it if nobody complains","Delete every audit record","Report the incident promptly and follow containment procedures","Publicly share further copies"],"correct":2,"why":"Prompt escalation enables risk assessment, containment and legally required notifications where applicable.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new5","n":198},{"id":"original-mock-199","topic":"C3.3","stem":"Which approach best maintains accuracy of athlete monitoring records?","options":["Share identifiable records to verify via social media","Correct or flag the error following approved procedures","Leave known errors uncorrected","Replace scores without an audit trail"],"correct":1,"why":"Personal data should be accurate and updated as needed using appropriate audit processes.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new3","n":199},{"id":"original-mock-200","topic":"C3.3","stem":"Does an athlete's consent always provide the only legal basis for routine processing of personal data?","options":["All sports data are exempt from UK GDPR","Consent is never relevant","Verbal reassurance replaces lawful basis","A suitable lawful basis is required but it need not always be consent"],"correct":3,"why":"UK GDPR recognises several lawful bases; additional conditions may apply to special-category data.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new5","n":200},{"id":"original-quiz-001","topic":"A1.1","stem":"During a five-second sprint, a muscle rapidly restores ATP using PCr. Which enzyme drives this reaction?","options":["Creatine kinase","Pyruvate dehydrogenase","Lactate dehydrogenase","Citrate synthase"],"correct":0,"why":"Creatine kinase reversibly transfers a high-energy phosphate between phosphocreatine and ADP.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":1},{"id":"original-quiz-002","topic":"A1.1","stem":"When pyruvate enters mitochondria during aerobic exercise, which enzyme complex links glycolysis to the Krebs cycle?","options":["Creatine kinase","Phosphofructokinase","Pyruvate dehydrogenase complex","Lactate dehydrogenase"],"correct":2,"why":"The pyruvate dehydrogenase complex performs oxidative decarboxylation to acetyl-CoA.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":2},{"id":"original-quiz-003","topic":"A1.1","stem":"A researcher measures ATP synthesis through the electron transport chain. Where is this process located?","options":["Inner mitochondrial membrane","Sarcoplasmic reticulum","Outer nuclear membrane","Cytosol"],"correct":0,"why":"The respiratory complexes and ATP synthase are embedded in the inner mitochondrial membrane.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":3},{"id":"original-quiz-004","topic":"A1.1","stem":"An athlete exercises at high intensity and glycolytic flux rises. Which cofactor is required for continued oxidation of glyceraldehyde-3-phosphate?","options":["FADH2","NAD+","Acetyl-CoA","ADP-ribose"],"correct":1,"why":"Glycolysis requires oxidised NAD+, regenerated through mitochondrial oxidation and/or lactate formation.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":4},{"id":"original-quiz-005","topic":"A1.1","stem":"An increase in exercise intensity activates glycolytic ATP supply. Which enzyme has a central regulatory role?","options":["Adenylate cyclase","Myosin ATPase","Succinate dehydrogenase","Phosphofructokinase"],"correct":3,"why":"PFK catalyses a key regulated step converting fructose-6-phosphate to fructose-1,6-bisphosphate.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":5},{"id":"original-quiz-006","topic":"A1.1","stem":"During an all-out 20-second effort, which process can directly produce ATP in the cytosol independent of oxygen?","options":["Electron transport chain","Citric acid cycle alone","Anaerobic glycolysis","Beta-oxidation alone"],"correct":2,"why":"Substrate-level phosphorylation in glycolysis does not itself require oxygen.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":6},{"id":"original-quiz-007","topic":"A1.1","stem":"A coach asks what Krebs-cycle reactions mainly provide to oxidative phosphorylation. What is the best answer?","options":["Conversion of oxygen into glycogen","Direct resynthesis of all sprint PCr","Direct production of lactate for all ATP","Reduced electron carriers such as NADH and FADH2"],"correct":3,"why":"The cycle provides electron carriers to the respiratory chain, along with a small amount of substrate-level phosphorylation.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":7},{"id":"original-quiz-008","topic":"A1.1","stem":"A goalkeeper makes one explosive dive from rest. Which intramuscular reserve most rapidly buffers ATP turnover?","options":["Liver glycogen alone","Phosphocreatine","Triglyceride stored in adipose tissue","Blood glucose alone"],"correct":1,"why":"Pre-existing ATP and PCr provide very rapid energy at the onset of maximal effort.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":8},{"id":"original-quiz-009","topic":"A1.1","stem":"Repeated-sprint performance falls with short recovery. Which pathway supports recharging intramuscular PCr between repetitions?","options":["Mitochondrial oxidative ATP production","Conversion of lactate directly into creatine","Oxygen-independent PCr formation without ATP","Sodium leakage from cells"],"correct":0,"why":"Aerobic ATP generation supplies energy used to resynthesise phosphocreatine.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":9},{"id":"original-quiz-010","topic":"A1.1","stem":"As running intensity becomes very high, which substrate contribution generally increases relative to fat?","options":["Oxidation of bone collagen","Ketone oxidation exclusively","Dietary protein exclusively","Carbohydrate oxidation"],"correct":3,"why":"High ATP turnover favours carbohydrate use because carbohydrate supports faster ATP production.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":10},{"id":"original-quiz-011","topic":"A1.1","stem":"For a prolonged steady-state run, which system supplies large cumulative energy over time?","options":["Fast glycolysis without mitochondrial support","Stored ATP alone","Phosphagen stores alone","Oxidative metabolism"],"correct":3,"why":"Oxidative phosphorylation produces ATP at a lower maximal rate but supports sustained exercise.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":11},{"id":"original-quiz-012","topic":"A1.1","stem":"A laboratory removes the terminal electron acceptor from skeletal-muscle mitochondria. Which molecule is missing?","options":["Lactate","Creatine","Oxygen","Carbon dioxide"],"correct":2,"why":"Molecular oxygen is reduced to water at complex IV.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":12},{"id":"original-quiz-013","topic":"A1.1","stem":"Which system most rapidly buffers ATP when a sprinter pushes off the blocks?","options":["Very high-rate ATP regeneration for a brief period","A limitless ATP supply for hours","Most energy for a marathon","Direct conversion of lactate into oxygen"],"correct":0,"why":"PCr buffering responds quickly but the pool is limited.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":13},{"id":"original-quiz-014","topic":"A1.1","stem":"After endurance training, which change generally reduces the relative metabolic strain of running at the same absolute speed?","options":["Complete reliance on PCr","Loss of mitochondrial density","Lower capillary supply","Greater oxidative enzyme capacity"],"correct":3,"why":"Aerobic adaptations improve oxidative ATP generation and efficiency at a given workload.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":14},{"id":"original-quiz-015","topic":"A1.1","stem":"A student distinguishes glycolysis from the respiratory chain. Which process defines substrate-level phosphorylation?","options":["ATP synthase driven by a proton gradient","Formation of ATP only in the nucleus","Use of oxygen to phosphorylate creatine","Direct transfer of a phosphate to ADP or GDP from an intermediate"],"correct":3,"why":"Substrate-level phosphorylation directly transfers phosphate from an energy-rich intermediate.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":15},{"id":"original-quiz-016","topic":"A1.1","stem":"During maximal contraction, which ATP reaction directly supports myosin-head cycling?","options":["ATP reduction to NADH","ATP hydrolysis by myosin ATPase","Oxidation of ATP to pyruvate","Conversion of ATP into phosphocreatine by LDH"],"correct":1,"why":"Myosin ATPase hydrolyses ATP to power cross-bridge cycling.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":16},{"id":"original-quiz-017","topic":"A1.1","stem":"Following several weeks of repeated-sprint conditioning, which change could support recovery between sprints?","options":["Permanent depletion of PCr stores","Removal of mitochondrial respiration","Elimination of all glycolysis","Greater oxidative capacity in relevant muscle fibres"],"correct":3,"why":"Repeated high-intensity training can improve oxidative and glycolytic characteristics, depending on programme.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":17},{"id":"original-quiz-018","topic":"A1.2","stem":"A physiologist reports cardiac output during cycling. What quantity does this variable describe?","options":["Total lung ventilation per minute","Blood pumped with each single heartbeat only","Volume of blood pumped by one ventricle per minute","Arterial blood pressure at rest"],"correct":2,"why":"Cardiac output is heart rate multiplied by stroke volume.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":18},{"id":"original-quiz-019","topic":"A1.2","stem":"During an exercise test, an athlete pumps more blood with each contraction. What is this variable called?","options":["Cardiac output","Stroke volume","Ejection frequency","Mean arterial pressure"],"correct":1,"why":"Stroke volume is the amount of blood ejected per heartbeat.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":19},{"id":"original-quiz-020","topic":"A1.2","stem":"A runner increases speed stepwise during a graded test. What generally happens to their heart rate?","options":["It rises only after exercise stops","It remains constant despite work rate","It falls progressively toward zero","It rises with exercise intensity"],"correct":3,"why":"Heart rate commonly increases approximately linearly with work rate until near maximum.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":20},{"id":"original-quiz-021","topic":"A1.2","stem":"While cycling, leg blood flow rises despite sympathetic vasoconstriction elsewhere. Which mechanism explains this?","options":["Complete absence of sympathetic activity","A uniform reduction of all blood flow","Local metabolic vasodilator signals in working tissue","Sudden closing of active muscle capillaries"],"correct":2,"why":"Local metabolic factors help match perfusion to muscular demand.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":21},{"id":"original-quiz-022","topic":"A1.2","stem":"A coach wants to estimate VO2 from central circulation. Which second factor is required after cardiac output?","options":["Respiratory rate alone","Blood lactate alone","Arteriovenous oxygen-content difference","Systolic pressure alone"],"correct":2,"why":"The Fick principle states VO2 equals Q times the a-vO2 difference.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":22},{"id":"original-quiz-023","topic":"A1.2","stem":"During heavy exercise, a respiratory researcher measures how often the athlete breathes. Which variable is this?","options":["Tidal volume","Diffusion capacity","Breathing frequency","Minute ventilation"],"correct":2,"why":"Breathing frequency describes breaths taken per minute.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":23},{"id":"original-quiz-024","topic":"A1.2","stem":"A technician has tidal volume and breathing frequency. Which calculation gives total ventilated air per minute?","options":["Tidal volume minus residual volume","Heart rate multiplied by stroke volume","Tidal volume multiplied by breathing frequency","Breathing frequency divided by tidal volume"],"correct":2,"why":"Minute ventilation is the product of tidal volume and respiratory frequency.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":24},{"id":"original-quiz-025","topic":"A1.2","stem":"On a treadmill, an athlete breathes more deeply. Which variable directly captures the volume of each breath?","options":["Oxygen pulse","Tidal volume","Cardiac output","Breathing frequency"],"correct":1,"why":"Tidal volume is air inhaled or exhaled per breath.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":25},{"id":"original-quiz-026","topic":"A1.2","stem":"After a training block, a cyclist shows a lower resting heart rate. Which coexisting adaptation commonly helps explain it?","options":["Markedly lower blood oxygen carrying capacity","Greater resting stroke volume and autonomic changes","A complete loss of plasma volume","An increase in resting cardiac output proportional to HR"],"correct":1,"why":"Endurance adaptations often include increased stroke volume and altered autonomic regulation.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":26},{"id":"original-quiz-027","topic":"A1.2","stem":"A trainee follows blood leaving the right ventricle. Which destination should come next?","options":["Aorta leading directly to legs","Pulmonary arteries leading to lungs","Systemic veins leading to kidneys","Coronary sinus leading to liver"],"correct":1,"why":"The right ventricle pumps deoxygenated blood to the lungs via pulmonary arteries.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":27},{"id":"original-quiz-028","topic":"A1.2","stem":"A coach asks which chamber sends oxygenated blood through the aorta. Which is correct?","options":["Left ventricle","Left atrium","Right atrium","Right ventricle"],"correct":0,"why":"The left ventricle generates pressure for systemic circulation.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":28},{"id":"original-quiz-029","topic":"A1.2","stem":"During an endurance test, oxygen transport depends primarily on which blood component?","options":["Fibrinogen","Haemoglobin inside red blood cells","Plasma sodium","Platelets"],"correct":1,"why":"Most blood oxygen binds to haemoglobin.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":29},{"id":"original-quiz-030","topic":"A1.2","stem":"After aerobic training, a muscle biopsy shows more capillaries. Which benefit is most plausible?","options":["Permanent maximal blood pressure rise","Improved blood-tissue exchange and diffusion surface","Direct generation of contraction force by capillaries","Elimination of oxygen consumption"],"correct":1,"why":"Greater capillary density supports diffusion of oxygen and metabolite exchange.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":30},{"id":"original-quiz-031","topic":"A1.2","stem":"During a graded test, HR keeps rising while stroke volume changes little. What is a plausible contributor?","options":["Shorter ventricular filling time at high heart rates","Loss of circulating blood within seconds","Elimination of myocardial contractility","Complete cessation of venous return"],"correct":0,"why":"Filling time and cardiac properties can limit further SV increases, with individual variation.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":31},{"id":"original-quiz-032","topic":"A1.2","stem":"During running, rhythmic calf contractions assist which cardiovascular process?","options":["Arterial blood oxygen formation","Heart valve formation","Return of blood to the heart","Direct oxygen diffusion into alveoli"],"correct":2,"why":"Contracting muscles compress veins and aid venous return with one-way valves.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":32},{"id":"original-quiz-033","topic":"A1.2","stem":"During hard contractions, sensory feedback from muscle contributes to which acute response?","options":["Loss of sympathetic activity","A fall in respiratory effort to zero","Greater cardiovascular drive and blood pressure support","Immediate resting bradycardia"],"correct":2,"why":"Muscle afferent feedback influences autonomic and cardiovascular responses to exercise.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":33},{"id":"original-quiz-034","topic":"A1.2","stem":"An athlete completes a maximal incremental test with gas analysis. Which fitness variable is being estimated?","options":["Peak muscular force in newtons","Maximal blood lactate concentration","Maximal rate of oxygen consumption","Maximum respiratory rate alone"],"correct":2,"why":"VO2max reflects integrated oxygen transport and utilisation capacity.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":34},{"id":"original-quiz-035","topic":"A1.2","stem":"At the same work rate after endurance training, which change is typically found?","options":["No mitochondrial adaptation","Greater reliance on PCr throughout a 30-minute effort","Elimination of all carbohydrate oxidation","Lower lactate accumulation and greater oxidative reliance"],"correct":3,"why":"Training generally improves oxidative capacity and metabolic control.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":35},{"id":"original-quiz-036","topic":"A1.2","stem":"Near a ventilatory breakpoint, additional CO2 is released through buffering. What primarily drives the accompanying ventilatory rise?","options":["Conversion of lactate directly into CO2 by LDH","Complete absence of atmospheric oxygen","Increased CO2 stimulus from bicarbonate buffering","Loss of the diaphragm"],"correct":2,"why":"Buffering of associated H+ produces CO2 that contributes to ventilatory drive.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":36},{"id":"original-quiz-037","topic":"A1.2","stem":"As a footballer transitions from rest to intense running, which circulatory redistribution is most expected?","options":["Higher proportion of cardiac output to working muscles","Complete cessation of renal circulation","Higher proportion to digestive organs","Unchanged regional blood flow at all intensities"],"correct":0,"why":"Blood flow redistributes toward active muscle and skin when thermoregulatory demands rise.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":37},{"id":"original-quiz-038","topic":"A1.2","stem":"Two athletes have similar HRmax, but the trained athlete has higher VO2max. Which central factor can help explain this?","options":["Lower maximal cardiac output","Loss of ventricular filling","Higher maximal stroke volume","Lower total circulating blood volume"],"correct":2,"why":"Greater maximal stroke volume can improve maximal cardiac output and oxygen delivery.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":38},{"id":"original-quiz-039","topic":"A1.2","stem":"A runner increases breathing during hard exercise. Which effect helps maintain blood-gas homeostasis?","options":["Refreshes alveolar oxygen and helps remove CO2","Turns lactate into atmospheric oxygen","Directly synthesises haemoglobin","Converts glucose into muscle glycogen in lungs"],"correct":0,"why":"Alveolar ventilation maintains suitable oxygen and carbon-dioxide gradients.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":39},{"id":"original-quiz-040","topic":"A1.3","stem":"A coach observes recruitment of one motor neuron and all fibres it controls. What is this functional unit?","options":["Every motor neuron in a muscle","One sarcomere and its tendons","One alpha motor neuron and the muscle fibres it innervates","One neuromuscular junction without a fibre"],"correct":2,"why":"A motor unit is the alpha motor neuron plus all its innervated muscle fibres.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":40},{"id":"original-quiz-041","topic":"A1.3","stem":"During a sustained maximal contraction, firing rates rise. Which mechanism can increase motor-unit force?","options":["Muscle hyperplasia within seconds","Osteoclast recruitment","Rate coding","Loss of motor neuron excitability"],"correct":2,"why":"Increasing motor-unit discharge frequency can summate force and increase activation.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":41},{"id":"original-quiz-042","topic":"A1.3","stem":"As a lifter increases force from low to high, which recruitment order is generally predicted?","options":["Random units regardless of required force","All units simultaneously at any intensity","Highest-threshold units always first","Lower-threshold units before higher-threshold units"],"correct":3,"why":"The size principle generally produces orderly recruitment by threshold.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":42},{"id":"original-quiz-043","topic":"A1.3","stem":"A novice improves their 1RM markedly after two weeks. Which adaptation is most plausible as an early contributor?","options":["Improved neural coordination and activation","Immediate large bone-length growth","A doubling of muscle fibre number","Conversion of tendons into contractile tissue"],"correct":0,"why":"Early strength gains often reflect neural factors before substantial hypertrophy.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":43},{"id":"original-quiz-044","topic":"A1.3","stem":"A sport scientist studies fast, powerful muscle fibres. Which type usually has the fastest contractile kinetics?","options":["Type I","Type IIx","Slow oxidative only","Cardiac muscle fibre"],"correct":1,"why":"Type IIx fibres generally exhibit the fastest shortening kinetics in humans.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":44},{"id":"original-quiz-045","topic":"A1.3","stem":"After several months of training, ultrasound shows larger muscle fibres. What adaptation is described?","options":["All fibres becoming slower than before","An increase only in total motor neuron count","Loss of contractile proteins","Increased muscle fibre cross-sectional area"],"correct":3,"why":"Hypertrophy is growth in existing fibre size and contractile content.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":45},{"id":"original-quiz-046","topic":"A1.3","stem":"After an action potential, calcium leaves the sarcoplasmic reticulum. What is its immediate regulatory role?","options":["Destroying tropomyosin permanently","Directly splitting ATP in the liver","Binding troponin to permit actin-myosin interaction","Replacing myosin heads"],"correct":2,"why":"Calcium binds troponin C, shifting tropomyosin and exposing binding sites.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":46},{"id":"original-quiz-047","topic":"A1.3","stem":"A researcher suppresses calcium release within a muscle fibre. Which organelle has been targeted?","options":["Nuclear envelope exclusively","Mitochondrial outer membrane only","Sarcoplasmic reticulum","Golgi tendon organ"],"correct":2,"why":"The sarcoplasmic reticulum stores calcium and releases it during excitation-contraction coupling.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":47},{"id":"original-quiz-048","topic":"A1.3","stem":"A biopsy reveals changes in contractile thick-filament proteins. Which protein is principally involved?","options":["Collagen type I","Troponin C","Actin","Myosin"],"correct":3,"why":"Myosin makes up thick filaments and produces cross-bridge force.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":48},{"id":"original-quiz-049","topic":"A1.3","stem":"A student identifies filaments sliding toward the centre of a sarcomere. Which protein forms their principal backbone?","options":["Myosin","Titin only","Elastin","Actin"],"correct":3,"why":"Thin filaments are largely actin, alongside troponin and tropomyosin.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":49},{"id":"original-quiz-050","topic":"A1.3","stem":"A motor neuron action potential reaches the motor end plate. What structure is activated by neurotransmitter release?","options":["Bone periosteum","Ligament attachment","Golgi tendon organ","Neuromuscular junction"],"correct":3,"why":"Acetylcholine acts at the neuromuscular junction to excite the muscle membrane.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":50},{"id":"original-quiz-051","topic":"A1.3","stem":"Following progressive heavy resistance training, which structural adaptation is common?","options":["Complete elimination of all type I fibres","Immediate shortening of all tendons to zero","Universal loss of neural drive","Increase in contractile protein content"],"correct":3,"why":"Mechanical loading can increase myofibrillar size and maximal force capability.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":51},{"id":"original-quiz-052","topic":"A1.3","stem":"A runner completes a long aerobic programme. Which muscle property is most likely to increase?","options":["Mitochondrial enzyme activity","Cross-bridge force independent of ATP","Type IIx proportion to 100%","Number of bones in the legs"],"correct":0,"why":"Endurance training increases oxidative capacity through mitochondrial and enzymatic adaptation.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":52},{"id":"original-quiz-053","topic":"A1.3","stem":"A tendon elongates by 2 mm under a given force. Which mechanical relation describes its stiffness?","options":["Maximum joint angle divided by body mass","Change in tendon force divided by change in elongation","Muscle length divided by cardiac output","Duration of contraction divided by velocity"],"correct":1,"why":"Stiffness is slope of force-elongation curve, distinct from material modulus.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":53},{"id":"original-quiz-054","topic":"A1.3","stem":"Heavy loading is maintained for months. Which tendon adaptation is plausible?","options":["Immediate disappearance of collagen","Permanent zero tendon strain under all loads","Elimination of elastic energy storage","Increased tendon stiffness through structural or material changes"],"correct":3,"why":"Progressive mechanical loading may increase tendon stiffness and related properties.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":54},{"id":"original-quiz-055","topic":"A1.3","stem":"A goalkeeper adjusts their landing after visual and proprioceptive feedback. Which system integrates this information?","options":["Central nervous system","Pulmonary capillaries","Only the liver","Only the tendon collagen network"],"correct":0,"why":"The CNS integrates sensory information and coordinates motor output.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":55},{"id":"original-quiz-056","topic":"A1.3","stem":"A muscle fibre is stimulated at its membrane. Which anatomical structures propagate excitation deeper within the cell?","options":["Transverse tubules (T-tubules)","Synovial bursa","Bone canaliculi","Muscle spindles alone"],"correct":0,"why":"T-tubules carry depolarisation near calcium-release structures.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":56},{"id":"original-quiz-057","topic":"A1.3","stem":"A heavily loaded muscle repairs and remodels. Which cell type can support fibre adaptation by adding myonuclei?","options":["Osteoclast","Chondrocyte","Erythrocyte","Muscle satellite cell"],"correct":3,"why":"Satellite cells are muscle-resident stem cells that can contribute to repair and hypertrophy.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":57},{"id":"original-quiz-058","topic":"A1.3","stem":"Two muscles have similar activation but different physiological cross-sectional area. Which tends to allow the larger maximum force?","options":["Longer recovery interval during testing only","Higher tendon strain at rest alone","More skin capillaries","Greater physiological cross-sectional area"],"correct":3,"why":"Maximal force capacity scales substantially with physiological cross-sectional area.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":58},{"id":"original-quiz-059","topic":"A1.3","stem":"During rapid stretch-shortening action, which tissue behaviour contributes to temporary elastic-energy storage?","options":["Permanent destruction of actin","Lactate transport across the lung","Bone marrow respiration","Tendon and aponeurosis deformation"],"correct":3,"why":"Series elastic tissues can store and return mechanical energy during stretch-shortening movements.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":59},{"id":"original-quiz-060","topic":"A1.4","stem":"A bone remodelling unit begins formation after resorption. Which cell lays down new bone matrix?","options":["Osteoblast","Neutrophil","Osteoclast","Myocyte"],"correct":0,"why":"Osteoblasts produce osteoid that later mineralises.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":60},{"id":"original-quiz-061","topic":"A1.4","stem":"In a period of unloading, increased bone resorption occurs. Which cell carries out the resorption step?","options":["Osteoclast","Fibroblast","Osteocyte exclusively","Osteoblast"],"correct":0,"why":"Osteoclasts resorb bone via acidification and enzymes.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":61},{"id":"original-quiz-062","topic":"A1.4","stem":"Impact loading causes cellular signals that help direct bone remodelling. Which embedded cell is a key mechanosensor?","options":["Osteocyte","Chondrocyte exclusively","Myosin","Erythrocyte"],"correct":0,"why":"Osteocytes sense mechanical conditions and communicate with remodelling cells.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":62},{"id":"original-quiz-063","topic":"A1.4","stem":"A section of femoral shaft shows a thick, low-porosity outer wall. Which tissue is this?","options":["Cortical bone","Tendon","Hyaline cartilage","Trabecular bone"],"correct":0,"why":"Cortical bone provides a dense structural shell, especially prominent in diaphyses.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":63},{"id":"original-quiz-064","topic":"A1.4","stem":"A vertebral body shows lattice-like cancellous structure. What tissue is present?","options":["Ligament tissue","Trabecular bone","Fibrocartilage only","Dense cortical bone only"],"correct":1,"why":"Trabecular bone has a porous lattice with relatively high turnover.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":64},{"id":"original-quiz-065","topic":"A1.4","stem":"A coach asks what provides much of bone's compressive rigidity. Which mineral is predominant?","options":["Glycogen","Haemoglobin","Keratin","Hydroxyapatite crystals"],"correct":3,"why":"Hydroxyapatite containing calcium and phosphate provides mineral stiffness.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":65},{"id":"original-quiz-066","topic":"A1.4","stem":"A sample of demineralised bone remains flexible due to its organic scaffold. What protein dominates it?","options":["Actin","Myosin heavy chain","Albumin","Type I collagen"],"correct":3,"why":"Type I collagen provides the major organic scaffold and tensile toughness.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":66},{"id":"original-quiz-067","topic":"A1.4","stem":"Two programmes deliver similar total work, but one uses novel high-rate impacts. Which feature is often important for bone adaptation?","options":["Complete mechanical unloading","Absolute avoidance of recovery","High strain magnitude and rate with novelty","Only low-strain repetition count regardless of loading"],"correct":2,"why":"Bone responds to load magnitude, rate, direction and novelty, with adequate recovery.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":67},{"id":"original-quiz-068","topic":"A1.4","stem":"A normally active athlete undergoes extended immobilisation. Which bone change is plausible?","options":["Loss of all osteoclasts","Permanent increase in bone mass without load","Instant doubling of cortical thickness","Reduced bone mineral density in underloaded regions"],"correct":3,"why":"Disuse shifts remodelling toward net bone loss in many regions.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":68},{"id":"original-quiz-069","topic":"A1.4","stem":"An otherwise healthy person wants to improve hip bone loading. Which activity has a stronger impact-related mechanical stimulus?","options":["Seated non-weight-bearing cycling only","Progressive jumping or impact exercise","Passive stretching only","Breathing exercises"],"correct":1,"why":"Novel impact and weight-bearing loads typically stimulate bone more than unloaded cycling.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":69},{"id":"original-quiz-070","topic":"A1.4","stem":"A coach points to the outer connective-tissue covering of a bone. What is it?","options":["Epimysium","Endomysium","Periosteum","Myelin sheath"],"correct":2,"why":"The periosteum covers most external bone surfaces and supports growth and repair.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":70},{"id":"original-quiz-071","topic":"A1.4","stem":"In a skeletally immature athlete, which structure is responsible for longitudinal growth of long bones?","options":["Achilles tendon","Bone marrow sinus","Mature articular capsule","Growth cartilage near bone ends"],"correct":3,"why":"Long-bone lengthening occurs through growth plates until closure.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":71},{"id":"original-quiz-072","topic":"A1.4","stem":"A DXA scan reports areal BMD. Which interpretation is most appropriate?","options":["Number of osteoblasts per minute","Total bone strength in all directions","Direct tendon tensile strength","Mineral content per projected area"],"correct":3,"why":"Areal BMD reflects mineral quantity relative to projected bone area, not complete strength.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":72},{"id":"original-quiz-073","topic":"A1.4","stem":"A runner repeats the same modest loads every day. Why might bone adaptation plateau?","options":["All bone cells permanently stop remodelling","Bone cells become less responsive to familiar repetitive loading","Bone responds exclusively to exercise duration","Only blood lactate controls adaptation"],"correct":1,"why":"Bone adaptation depends partly on novel and sufficiently intense mechanical signals.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":73},{"id":"original-quiz-074","topic":"A1.4","stem":"A strength coach explains that skeletal structure adapts to habitual loading direction and magnitude. Which principle is relevant?","options":["Motor-unit recruitment order","Glycolytic ATP synthesis","Functional adaptation of bone to mechanical stress","Cardiac output regulation"],"correct":2,"why":"Wolff's law summarises the relationship between mechanical loading and bone architecture.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":74},{"id":"original-quiz-075","topic":"A1.5","stem":"A team travels from sea level to high altitude. Which environmental change causes reduced inspired PO2?","options":["Lower barometric pressure","Greater oxygen molecular weight","Higher humidity alone","A lower percentage of oxygen in dry air"],"correct":0,"why":"Atmospheric oxygen fraction is roughly constant; total barometric pressure declines.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":75},{"id":"original-quiz-076","topic":"A1.5","stem":"An endurance athlete arrives at 2,500 m. Which early physiological response is expected?","options":["Complete absence of sympathetic activation","Increased ventilation","Reduced breathing despite hypoxia","Immediate doubling of red-cell mass"],"correct":1,"why":"Hypoxaemia stimulates ventilation through peripheral chemoreceptors.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":76},{"id":"original-quiz-077","topic":"A1.5","stem":"After several weeks with sufficient hypoxic dose, which response may occur?","options":["Reduced red-cell production in every individual","Complete loss of erythropoietin secretion","Increased haemoglobin mass","Permanent zero ventilation"],"correct":2,"why":"Erythropoiesis may increase haemoglobin mass under sufficient altitude exposure.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":77},{"id":"original-quiz-078","topic":"A1.5","stem":"In hot humid weather, an athlete sweats. Which process removes heat most effectively when allowed?","options":["Sweat merely dripping onto ground","Evaporation of sweat from skin","Direct heat production in muscles","Absorption of infrared energy"],"correct":1,"why":"Evaporation removes latent heat; dripped sweat gives little evaporative cooling.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":78},{"id":"original-quiz-079","topic":"A1.5","stem":"On a hot humid day, a player struggles to cool despite heavy sweating. What environmental limitation is responsible?","options":["Reduced vapour-pressure gradient for evaporation","A reduction in exercise metabolic heat production","Instant loss of all sweat glands","An increase in the evaporation gradient"],"correct":0,"why":"Humid air decreases the evaporative driving gradient.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":79},{"id":"original-quiz-080","topic":"A1.5","stem":"An athlete trains in a hot environment repeatedly over 10 days. Which change is plausible?","options":["Earlier and more effective sweating at a given internal temperature","Permanent rise in resting core temperature","No sweating at high temperatures","Automatic doubling of maximal oxygen uptake"],"correct":0,"why":"Heat acclimation often improves sweat response and cardiovascular stability.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":80},{"id":"original-quiz-081","topic":"A1.5","stem":"Two equal training sessions differ mainly in environmental conditions. Which raises thermal strain?","options":["Lower exercise heat production","Cool shade and good air flow","High wet-bulb globe temperature","Plentiful effective evaporative cooling"],"correct":2,"why":"High combined heat and humidity increases risk at a given workload.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":81},{"id":"original-quiz-082","topic":"A1.5","stem":"A player starts sprinting immediately after prolonged cold exposure. Which effect may reduce performance?","options":["Higher glycogen content within seconds","Lower nerve conduction and muscle contraction speed","Guaranteed increased maximal shortening velocity","Permanent expansion of lung volume"],"correct":1,"why":"Cold muscles usually show reduced contractile and neural function.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":82},{"id":"original-quiz-083","topic":"A1.5","stem":"A football team flies several time zones east. Which internal-clock adjustment is generally needed?","options":["Phase advance to earlier local times","Reversal of the 24-hour clock","Phase delay to later local times","No change in sleep timing"],"correct":0,"why":"Eastward travel typically requires shifting the clock earlier, often harder than delaying.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":83},{"id":"original-quiz-084","topic":"A1.5","stem":"An athlete travels for competition. Which approach can help shift the circadian system?","options":["Keeping home-time sleep forever","Unlimited caffeine at bedtime","Randomly alternating sleep times","Timely light exposure aligned with destination schedule"],"correct":3,"why":"Appropriately timed light and sleep scheduling help resynchronise circadian rhythm.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":84},{"id":"original-quiz-085","topic":"A1.5","stem":"A runner repeats their sea-level pace at 2,000 m. Why might it feel harder?","options":["Mitochondria stop working completely","Reduced inspired oxygen pressure increases relative strain","A higher inspired oxygen pressure reduces effort","Sea-level and altitude VO2max are necessarily identical"],"correct":1,"why":"Reduced oxygen availability can increase relative intensity at a fixed absolute speed.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":85},{"id":"original-quiz-086","topic":"A1.5","stem":"An event organiser considers temperature, humidity and radiation. Which index is commonly used?","options":["Bone density T-score","Resting respiratory rate alone","Body mass index alone","Wet-bulb globe temperature (WBGT)"],"correct":3,"why":"WBGT integrates major environmental contributions to thermal load.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":86},{"id":"original-quiz-087","topic":"A2.1","stem":"A coach analyses forward knee movement during a squat. Which plane is primarily involved?","options":["Frontal plane","Transverse plane","Sagittal plane","Horizontal coronal plane"],"correct":2,"why":"Flexion and extension occur predominantly in the sagittal plane.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":87},{"id":"original-quiz-088","topic":"A2.1","stem":"A goalkeeper laterally abducts their hip. In which principal plane is this action described?","options":["Sagittal plane","Frontal plane","Transverse plane","Parasagittal plane"],"correct":1,"why":"Abduction and adduction usually occur in the frontal plane.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":88},{"id":"original-quiz-089","topic":"A2.1","stem":"A player rotates their trunk to follow a ball. Which plane best describes the movement?","options":["Frontal plane","Transverse plane","Sagittal plane","Median plane"],"correct":1,"why":"Rotational actions around a longitudinal axis occur in the transverse plane.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":89},{"id":"original-quiz-090","topic":"A2.1","stem":"A lifter performs an elbow-flexion curl in the sagittal plane. Around what axis is motion described?","options":["An axis perpendicular to all planes","Anteroposterior axis","Mediolateral axis","Longitudinal axis"],"correct":2,"why":"Sagittal movement rotates around a mediolateral axis.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":90},{"id":"original-quiz-091","topic":"A2.1","stem":"A goalkeeper lifts their leg laterally in the frontal plane. Which axis runs perpendicular to that plane?","options":["An oblique axis is always required","Mediolateral axis","Longitudinal axis","Anteroposterior axis"],"correct":3,"why":"Frontal-plane motion typically occurs around the anteroposterior axis.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":91},{"id":"original-quiz-092","topic":"A2.1","stem":"A footballer turns their torso left and right. Around which axis does this transverse-plane movement occur?","options":["Mediolateral axis","Longitudinal vertical axis","Anteroposterior axis","No rotational axis"],"correct":1,"why":"Transverse motion rotates around a longitudinal axis.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":92},{"id":"original-quiz-093","topic":"A2.1","stem":"A coach needs to identify a multiaxial joint capable of flexion, abduction and rotation. Which is suitable?","options":["Humeroulnar joint","Proximal interphalangeal joint","Glenohumeral joint","Distal tibiofibular syndesmosis"],"correct":2,"why":"The shoulder is a ball-and-socket joint with movement in multiple planes.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":93},{"id":"original-quiz-094","topic":"A2.1","stem":"During a biceps curl, which joint is primarily responsible for flexion-extension movement?","options":["Radiocarpal joint","Hip joint","Humeroulnar joint","Shoulder joint"],"correct":2,"why":"The humeroulnar articulation behaves mainly as a hinge.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":94},{"id":"original-quiz-095","topic":"A2.1","stem":"A rower's forearm rotates between palm-up and palm-down positions. Which articulation is central?","options":["Proximal and distal radioulnar joints","Humeroulnar hinge only","Acromioclavicular joint only","Talocrural joint"],"correct":0,"why":"Pronation/supination occurs at radioulnar articulations.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":95},{"id":"original-quiz-096","topic":"A2.1","stem":"At the start of a high-knee drive, the thigh approaches the torso. What is this movement?","options":["Hip external rotation","Hip flexion","Hip abduction","Hip extension"],"correct":1,"why":"Hip flexion reduces the angle between femur and anterior trunk.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":96},{"id":"original-quiz-097","topic":"A2.1","stem":"A footballer sinks into a deep squat and moves the shin forward over the foot. Which ankle action is this?","options":["Foot moves upward toward the shin","Sole turns inward","Toes point downward away from shin","Sole turns outward"],"correct":0,"why":"Dorsiflexion brings the dorsum of the foot toward the shin.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":97},{"id":"original-quiz-098","topic":"A2.1","stem":"During a vertical jump take-off, the athlete pushes through the forefoot. Which ankle action contributes?","options":["Knee flexion","Plantarflexion","Eversion","Dorsiflexion"],"correct":1,"why":"Plantarflexion points the foot downward and is produced by the plantarflexors.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":98},{"id":"original-quiz-099","topic":"A2.1","stem":"When a lifter drives upward from a squat, which muscle contributes strongly to hip extension?","options":["Biceps brachii","Gluteus maximus","Tibialis anterior","Rectus abdominis"],"correct":1,"why":"Gluteus maximus is a major hip extensor.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":99},{"id":"original-quiz-100","topic":"A2.1","stem":"A player straightens their knee against resistance. Which muscle group provides the main knee-extension torque?","options":["Gastrocnemius alone","Gluteus medius","Quadriceps femoris","Hamstrings"],"correct":2,"why":"The quadriceps extend the knee via the extensor mechanism.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":100},{"id":"original-quiz-101","topic":"A2.1","stem":"During a prone leg-curl exercise, which group primarily flexes the knee?","options":["Quadriceps","Hamstrings"," ctive muscle action","Concentric action exclusively"],"correct":1,"why":"Eccentric muscle-tendon work commonly dissipates kinetic energy during landings.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":114},{"id":"original-quiz-115","topic":"A2.2","stem":"A player stabilises the knee as both quadriceps and hamstrings develop tension. What is this called?","options":["Co-contraction","Complete agonist inhibition","Reciprocal inhibition of all muscles","Passive-only joint stiffness"],"correct":0,"why":"Co-contraction involves simultaneous activation of opposing muscle groups.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":115},{"id":"original-quiz-116","topic":"A2.2","stem":"A lifter presses the bar away from the chest. What action do elbow extensors primarily perform?","options":["Eccentric","Passive stretch without force","Static isometric throughout","Concentric"],"correct":3,"why":"Triceps generate concentric elbow extension during the press phase.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":116},{"id":"original-quiz-117","topic":"A2.2","stem":"During a pulldown, which shoulder movement can latissimus dorsi generate?","options":["Shoulder extension and adduction","Ankle inversion","Wrist supination only","Knee extension"],"correct":0,"why":"Latissimus dorsi contributes to shoulder extension, adduction and internal rotation.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":117},{"id":"original-quiz-118","topic":"A2.2","stem":"A jumper rapidly transitions from a countermovement to propulsion. What mechanism is being used?","options":["Purely aerobic ATP resynthesis","Isometric contraction without any preceding movement","Rapid eccentric-to-concentric muscle-tendon transition","Sustained resting muscle stretch alone"],"correct":2,"why" "Standard error of measurement"],"correct":3,"why":"SEM estimates within-person measurement imprecision in score units.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":162},{"id":"original-quiz-163","topic":"A3.2","stem":"An analyst reports typical error as a percentage of the mean score. What measure is being used?","options":["Intraclass correlation coefficient","Pearson r alone","Standard deviation divided by sample size only","Coefficient of variation"],"correct":3,"why":"CV expresses relative variability as a percent of the mean under suitable assumptions.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":163},{"id":"original-quiz-164","topic":"A3.2","stem":"A coach wants a repeatable field assessment of lower-body jump output. Which measure is most relevant?","options":["Body mass index","Vertical jump height","Resting heart rate only","Sit-and-reach distance"],"correct":1,"why":"Vertical jump tests reflect aspects of lower-body explosive performance.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":164},{"id":"original-quiz-165","topic":"A3.2","stem":"An athlete needs an estimate of maximal concentric force capability in a chosen lift. Which test is appropriate?","options":["Resting lactate measurement","One-repetition maximum","Sit-and-reach test","Twelve-minute run"],"correct":1,"why":"A standardised 1RM assesses the greatest load lifted once with appropriate technique.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":165},{"id":"original-quiz-166","topic":"A3.2","stem":"A football team needs an incremental field test including repeated 20-m runs and increasing speeds. Which test fits?","options":["30-m sprint from a standing start","20-m multistage shuttle run","1RM squat","Seated medicine-ball throw"],"correct":1,"why":"A multistage shuttle run can estimate aerobic fitness within test limitations.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":166},{"id":"original-quiz-167","topic":"A3.2","stem":"Two coaches independently score the same movement task. Which measurement property describes agreement between them?","options":["Inter-rater reliability","Between-athlete variability","Test validity exclusively","Biological adaptation"],"correct":0,"why":"Inter-rater reliability concerns consistency across different assessors.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":167},{"id":"original-quiz-168","topic":"A3.2","stem":"A novice improves test performance on a second attempt from better understanding of the task. Familiarisation addresses which issue?","options":["Learning effects that distort performance comparison","All random measurement error permanently","The need for equipment calibration","True long-term hypertrophy in one day"],"correct":0,"why":"Practice can stabilise test technique and reduce learning-related bias.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":168},{"id":"original-quiz-169","topic":"A3.2","stem":"A coach wants a performance difference large enough to exceed measurement error at a chosen confidence level. What metric is relevant?","options":["Standardised warm-up duration","Minimal detectable change","Maximal acceleration","Population mean alone"],"correct":1,"why":"MDC represents the smallest change distinguishable from noise at a stated confidence level.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":169},{"id":"original-quiz-170","topic":"A3.2","stem":"Two sprint-test sessions use different surfaces and footwear. Why is this problematic?","options":["It always causes identical results","It removes fatigue from the participant","It introduces unwanted variation that obscures true change","It guarantees validity regardless of test"],"correct":2,"why":"Standardisation reduces uncontrolled sources of variation.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":170},{"id":"original-quiz-171","topic":"A3.2","stem":"A performance staff member schedules repeated tests for multiple physical qualities. Which approach is best?","options":["Ignore athlete safety and consent","Use every available test regardless of utility","Maximise fatigue before every test","Choose valid, reliable and practically relevant tests"],"correct":3,"why":"Testing should match purpose and be reliable, valid, safe and feasible.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":171},{"id":"original-quiz-172","topic":"A3.2","stem":"A coach includes jumps, sprints and a taxing endurance test in the same battery. What order generally helps preserve sprint quality?","options":["Order never influences outcomes","Only after exhaustion","Immediately after a maximal lactate test every time","Before the fatiguing endurance test"],"correct":3,"why":"High-skill high-output tests are usually performed before fatiguing tests.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":172},{"id":"original-quiz-173","topic":"A3.2","stem":"A programme aims to detect small meaningful performance improvements. Which test quality becomes especially important?","options":["Ability to detect genuine change beyond noise","The size of a team crest","Only the number of questionnaire items","The tester's preferred time of day"],"correct":0,"why":"Sensitive measures discriminate actual training effects from measurement variability.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":173},{"id":"original-quiz-174","topic":"A3.2","stem":"A youth athlete is compared with adult elite players using identical norms. What problem can result?","options":["The athlete's score becomes mathematically invalid","All tests lose reliability immediately","Norms always apply equally to every population","Unmatched age, population and context confound interpretation"],"correct":3,"why":"Reference populations need to match relevant participant characteristics and test protocols.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":174},{"id":"original-quiz-175","topic":"A3.2","stem":"A jump score correlates with sprint performance. What conclusion cannot be made from correlation alone?","options":["That measurement units should be reported","That a numerical association can be calculated","That the two variables covary in the sample","That improving the jump score will necessarily cause faster sprinting"],"correct":3,"why":"Correlation does not establish causality or transfer from a specific intervention.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":175},{"id":"original-quiz-176","topic":"B2.2","stem":"An athlete plans a near-maximal free-weight bench press. Which safety arrangement is appropriate?","options":["Removing all rack safety devices","Closing eyes during the lift","Using a thumbless grip without safeguards","Competent spotting or safety bars where suitable"],"correct":3,"why":"Suitable spotting or safeties reduce risk if a lifter fails a repetition.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":176},{"id":"original-quiz-177","topic":"B2.2","stem":"As the bar moves away from the chest, which shoulder action is important?","options":["Ankle dorsiflexion","Shoulder horizontal abduction","Hip internal rotation","Horizontal adduction"],"correct":3,"why":"Pectoralis major contributes to shoulder horizontal adduction during pressing.","source":"Origina ions (not official UKSCA papers)","kind":"quiz","paper":"random","n":181},{"id":"original-quiz-182","topic":"B2.2","stem":"A lifter loses bar control on heavy repetitions. What is the safest initial coaching action?","options":["Remove the spotter","Reduce load and restore a controlled movement pattern","Increase load immediately","Continue despite repeated unsafe failures"],"correct":1,"why":"Technical consistency and safety come before progressing load.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":182},{"id":"original-quiz-183","topic":"B2.2","stem":"A novice supports a heavy bar in the hands. Which grip is usually recommended?","options":["Open thumbless grip for all lifters","No contact between palm and bar","Closed grip with thumb around the bar","Only fingertips contacting the bar"],"correct":2,"why":"A closed grip helps reduce risk of the bar rolling from the hands.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":183},{"id":"original-quiz-184","topic":"B2.2","stem":"An athlete pulls a bar toward the torso. Which muscle group assists shoulder extension?","options":["Latissimus dorsi","Quadriceps only","Tibialis anterior only","Gastrocnemius only"],"correct":0,"why":"Latissimus dorsi and upper-back muscles assist rowing while elbow flexors contribute.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":184},{"id":"original-quiz-185","topic":"B2.3","stem":"An athlete holds a hamstring stretch at an end range without moving. What technique is this?","options":["Static stretching","Plyometric hopping","Agility training","Ballistic stretching"],"correct":0,"why":"Static stretching involves maintaining a stretch position over time.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":185},{"id":"original-quiz-186","topic":"B2.3","stem":"A team 2.3","stem":"A team alternates work bouts and recovery periods. Which training structure describes this?","options":["Isolated 1RM testing","Passive stretching alone","Interval training","Constant continuous activity"],"correct":2,"why":"Interval training alternates defined exercise and recovery segments.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":190},{"id":"original-quiz-191","topic":"B2.3","stem":"A footballer performs many short intense bouts. Which quality can support recovery between efforts?","options":["Only maximal flexibility","Aerobic oxidative capacity","Elimination of all blood flow to muscle","Complete loss of mitochondrial enzymes"],"correct":1,"why":"Aerobic capacity supports substrate replenishment and between-bout recovery.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":191},{"id":"original-quiz-192","topic":"B2.3","stem":"A player performs prolonged static stretching just before maximal jumping. Which consideration is most relevant?","options":["Complete elimination of injury risk","Instant bone remodelling","Guaranteed large increase in explosive power","Potential transient reductions in force or power in some circumstances"],"correct":3,"why":"Prolonged static stretching can transiently impair explosive outputs depending on dose and context.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":192},{"id":"original-quiz-193","topic":"B2.3","stem":"A coach prescribes endurance runs at a percentage of maximum aerobic speed. What variable is being controlled?","options":["Resting bone density","Forearm pronation","Grip width","Relative exercise intensity"],"correct":3,"why":"Relative speed or physiological thresholds help prescribe endurance intensity.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"quiz","paper":"random","n":193},{"id":"original-
