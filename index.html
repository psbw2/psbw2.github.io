":["ATP turnover and phosphocreatine buffering; no energy system acts alone.","Anaerobic glycolysis: substrate-level ATP production, pyruvate–lactate reaction and NAD+ regeneration.","Aerobic metabolism: carbohydrate/fat oxidation, mitochondria, Krebs cycle, electron transport chain.","Relative ATP supply by intensity/duration; repeated-effort recovery and phosphocreatine resynthesis."],"recall":["Which pathway has the highest ATP production rate?","How does lactate formation sustain glycolysis?","Why does aerobic capacity matter between maximal sprints?"]},"A1.2":{"title":"Cardiovascular & respiratory responses","group":"Physiology","book":"Ch 1 · pp. 13–19; Ch 6 · pp. 122–139","pages":[13,19,122,139],"core":["Q = HR × SV; blood flow redistribution and arteriovenous oxygen difference (Fick).","Acute HR, cardiac output, stroke volume, blood pressure and ventilation response as work rate increases.","Ventilatory breakpoint / thresholds and increased CO2 from bicarbonate buffering.","Chronic endurance changes: blood volume, stroke volume, mitochondrial enzymes and capillarisation.","Distinguish VO2max, submaximal HR, ventilatory efficiency and aerobic v anaerobic adaptations."],"recall":["Calculate cardiac output for HR 160 beats/min and SV 110 mL.","How do active-muscle and splanchnic blood flows differ during exercise?","Why does ventilation rise disproportionately near a threshold?"]},"A1.3":{"title":"Neuromuscular & connective-tissue adaptation","group":"Physiology","book":"Ch 1 · pp. 4–13; Ch 5 · pp. 94–108","pages":[4,13,94,108],"core":["Motor-unit anatomy: alpha motor neuron, muscle fibres, neuromuscular junction.","Recruitment by threshold (size principle), rate coding, coordination and early strength gains.","Type I/IIa/IIx properties and adaptation; avoid assuming all type I converts to IIx.","Sarcomere, actin–myosin, fascicles, fibre hypertrophy versus neural adaptation.","Tendon / ligament collagen, stiffness and mechanical loading effects; fatigue and detraining."],"recall":["Explain motor-unit recruitment during a progressively heavier squat.","Why can strength improve before major hypertrophy?","How do GTOs, spindles and tendons differ?"]},"A1.4":{"title":"Skeletal structure & bone adaptation","group":"Physiology","book":"Ch 4 · pp. 66–73; Ch 5 · pp. 103–108","pages":[66,73,103,108],"core":["Bone types and functions: long, short, flat, irregular; cortical versus trabecular.","Osteoblasts build; osteoclasts resorb; osteocytes sense strain and signal adaptation.","Remodelling, formation and resorption; response to strain magnitude, rate, novelty and recovery.","Bone adaptation to impacts/resistance exercise, unloading, detraining and injury risk.","Learn from first principles: bone cells → mechanotransduction → remodelling → practical loading."],"recall":["Differentiate osteoblast, osteoclast and osteocyte.","Why are novel impacts potentially osteogenic?","Compare compact and trabecular bone."]},"A1.5":{"title":"Environment, travel & performance","group":"Physiology","book":"Ch 6 · pp. 134–139; Ch 10 · pp. 217–222","pages":[134,139,217,222],"core":["Altitude: lower inspired oxygen pressure, acute ventilatory response and acclimatisation.","Heat / humidity: thermoregulation, sweat evaporation, blood volume and heat acclimation.","Cold: muscle temperature, dexterity, force and thermal safety.","Jet lag: direction of travel, time-zone adjustment, circadian timing and performance."],"recall":["What happens to ventilation upon altitude exposure?","Why does humidity reduce cooling?","Why can eastward travel be harder to adapt to?"]},"A2.1":{"title":"Functional anatomy & joint mechanics","group":"Anatomy","book":"Ch 4 · pp. 66–90","pages":[66,90],"core":["Planes/axes: sagittal–mediolateral; frontal–anteroposterior; transverse–longitudinal.","Synovial joint types, key structures and permitted movements.","Flexion, extension, abduction, adduction, rotation, pronation, supination, dorsiflexion and plantarflexion.","Break down ":"Supplied UKSCA sample paper","paper":"s2","n":37},{"id":"s2-38","topic":"A3.1","stem":"When determining a football player's individual resistance training programme needs, which of the following does not need to be considered?","options":["Past medical history","Training status","Playing position","Programmes of other players"],"correct":3,"why":"Answer key from your uploaded sample paper. Use the matching competency lesson and textbook reading to explain why the correct option works and the others do not.","source":"Supplied UKSCA sample paper","paper":"s2","n":38},{"id":"s2-39","topic":"C3.3","stem":"When processing personal information such as test data, data processing must comply with the data protection act. Which of the following violates an enforceable principle of this act?","options":["Data should not be kept longer than necessary","Data should be processed in accordance to the person's rights","Data should be secure","Data can be processed for unlimited purposes"],"correct":3,"why":"Answer key from your uploaded sample paper. Use the matching competency lesson and textbook reading to explain why the correct option works and the others do not.","source":"Supplied UKSCA sample paper","paper":"s2","n":39},{"id":"s2-40","topic":"A1.4","stem":"Which of the following exercises would best develop bone mineral density in the humerus?","options":["Bench press","Pec dec flys","Pulldown","All would be equally effective"],"correct":0,"why":"Answer key from your uploaded sample paper. Use the matching competency lesson and textbook reading to explain why the correct option works and the others do not.","source":"Supplied UKSCA sample paper","paper":"s2","n":40},{"id":"s2-41","topic":"A3.1","stem":"Which of the following is not a characteristic of the conjugate sequencing system?","options":["A series of concentrated blocks of training","An aim to saturate the system with a variety of different fitness stresses","An aim to saturate the system with one type of stress llowing is the most likely primary determinant of stride length in sprinters?","options":["Total ground reaction forces","Flexibility of the hamstrings","Hip flexor strength","Hip flexor flexibility"],"correct":0,"why":"Answer key from your uploaded sample paper. Use the matching competency lesson and textbook reading to explain why the correct option works and the others do not.","source":"Supplied UKSCA sample paper","paper":"s2","n":45},{"id":"s2-46","topic":"A2.3","stem":"Which of the following is true about the structure of the golgi tendon organ?","options":["The GTO is connected to a small group of muscle fibres (3- 25)","The GTO is connected to a large number of muscle fibres (100 – 200)","The GTO is connected to the entire muscle","The GTO is not connected to a muscle"],"correct":0,"why":"Answer key from your uploaded sample paper. Use the matching competency lesson and textbook reading to explain why the correct option works and the others do not.","source":"Supplied UKSCA sample paper","paper":"s2","n":46},{"id":"s2-47","topic":"A1.1","stem":"Which of the following statements is true regarding the relative roles of fat, carbohydrate, and protein as energy sources for cellular metabolism?","options":["Much more energy is stored in the body in the form of carbohydrate than in the form of fat","Protein is the predominant fuel source during exercise","Fat cannot provide all of the energy required for high-intensity muscular activity because the rate of energy release from fat is too slow","Since glycogen reserves in the body are so large, only limited amounts of carbohydrate are needed in the daily diet"],"correct":2,"why":"Answer key from your uploaded sample paper. Use the matching competency lesson and textbook reading to explain why the correct option works and the others do not.","source":"Supplied UKSCA sample paper","paper":"s2","n":47},{"id":"s2-48","topic":"A2.3","stem":"Which of the following types of motor control systems requires the greatest amount of sensory feedback contributions during the movement?","options":["Closed loop motor control","Open loop motor control","Modulated loop motor control","None involve sensory feedback"],"correct":0,"why":"Answer key from your uploaded sample paper. Use the matching competency lesson and textbook reading to explain why the correct option works and the others do not.","source":"Supplied UKSCA sample paper","paper":"s2","n":48},{"id":"s2-49","topic":"A2.2","stem":"Which of these exercises would you prescribe to develop unilateral strength in the quadriceps and glutes?","options":["Lunge","Squat","Deadift","Stiff leg deadlift"],"correct":0,"why":"Answer key from your uploaded sample paper. Use the matching competency lesson and textbook reading to explain why the correct option works and the others do not.","source":"Supplied UKSCA sample paper","paper":"s2","n":49},{"id":"s2-50","topic":"A1.2","stem":"With increasing rates of work, the arterial-mixed venous oxygen difference will respond in which of the following ways?","options":["Increased arterial content and reduced mixed venous oxygen content","No change in arterial content and reduced mixed venous oxygen content","Decreased arterial oxygen content and increased mixed venous oxygen content","Decreased arterial oxygen content and no change in mixed venous oxygen content"],"correct":3,"why":"Answer key from your uploaded sample paper. Use the matching competency lesson and textbook reading to explain why the correct option works and the others do not.","source":"Supplied UKSCA sample paper","paper":"s2","n":50},{"id":"new-001","topic":"A1.1","stem":"For a single maximal effort lasting approximately 4 seconds, which pathway supplies ATP at the highest rate?","options":["Fat oxidation","Cori cycle","Phosphagen (ATP–PCr)","Oxidative phosphorylation"],"correct":2,"why":"The phosphagen system has the fastest ATP resynthesis rate for very brief maximal efforts.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":1},{"id":"new-002","topic":"A1.1","stem":"Which process produces ATP directly during glycolysis without using the mitochondrial electron transport chain?","options":["Substrate-level phosphorylation","Creatine phosphorylation only","Oxidative phosphorylation","Beta-oxidation"],"correct":0,"why":"Glycolytic ATP is generated by substrate-level phosphorylation.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":1},{"id":"new-003","topic":"A1.1","stem":"During sustained moderate-intensity exercise, which system typically accounts for most ATP production?","options":["Aerobic oxidative metabolism","Stored ATP only","Anaerobic glycolysis only","Phosphagen only"],"correct":0,"why":"Oxidative pathways dominate as exercise duration increases and sufficient oxygen is available.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":2},{"id":"new-004","topic":"A1.1","stem":"What is lactate production most directly linked to?","options":["Regeneration of NAD+ so glycolysis can continue","Complete shutdown of mitochondria","Direct production of most H+ from lactate dehydrogenase","Breakdown of phosphocreatine into lactate"],"correct":0,"why":"Lactate dehydrogenase converts pyruvate to lactate while regenerating NAD+.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":2},{"id":"new-005","topic":"A1.1","stem":"Which statement about the three energy systems is most accurate?","options":["The ATP–PCr system needs oxygen to operate","One system works at a time","Aerobic metabolism produces ATP only after several minutes","All contribute simultaneously, but their relative contribution varies"],"correct":3,"why":"Energy systems overlap in all exercise; intensity and duration change their relative contributions.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":3},{"id":"new-006","topic":"A1.1","stem":"What is a principal reason high-intensity efforts cannot be maintained indefinitely?","options":["All lactate is poisonous to muscle","Oxygen delivery is zero at maximal exercise","The heart stops pumping at high intensity","Finite ATP-resynthesis capacity and fatigue-related disturbances"],"correct":3,"why":"High ATP turnover produces multiple fatigue-related limitations; it is not a single lactate-toxicity mechanism.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":3},{"id":"new-007","topic":"A1.1","stem":"Why is recovery between short maximal sprints helped by aerobic fitness?","options":["Phosphocreatine is resynthesised only during sprinting","Oxidative metabolism supports phosphocreatine resynthesis between efforts","All ATP is stored before training","Aerobic metabolism prevents neural fatigue entirely"],"correct":1,"why":"Recovery of phosphocreatine depends substantially on oxidative ATP production.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":4},{"id":"new-008","topic":"A1.1","stem":"Which product is formed when creatine kinase buffers ATP during a maximal sprint?","options":["Lactate and oxygen","Creatine and ATP from phosphocreatine and ADP","Glucose and glycogen","Fatty acids and carbon dioxide"],"correct":1,"why":"The reversible creatine kinase reaction rapidly reforms ATP using PCr.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":4},{"id":"new-009","topic":"A1.2","stem":"At a fixed stroke volume, what happens to cardiac output when heart rate rises?","options":["It remains constant","It decreases","It becomes independent of circulation","It increases"],"correct":3,"why":"Cardiac output equals heart rate multiplied by stroke volume.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":5},{"id":"new-010","topic":"A1.2","stem":"Which variable most commonly increases substantially after aerobic training at a given submaximal workload?","options":["Blood lactate at the same workload","Arterial oxygen saturation beyond normal levels","Resting heart rate","Stroke volume"],"correct":3,"why":"Aerobic adaptations include greater stroke volume; submaximal heart rate tends to fall.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":5},{"id":"new-011","topic":"A1.2","stem":"During dynamic exercise, blood flow is preferentially redistributed towards which tissues?","options":["Inactive muscle groups only","Active skeletal muscles","Kidneys","Digestive organs"],"correct":1,"why":"Local vasodilation increases flow to active muscle while sympathetic vasoconstriction reduces flow to some other beds.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":6},{"id":"new-012","topic":"A1.2","stem":"Why does breathing rise during strenuous exercise?","options":["To remove all lactic acid through lungs","To reduce respiratory muscle work to zero","To increase alveolar ventilation and CO2 removal while meeting gas exchange demand","Because arterial oxygen saturation always drops markedly"],"correct":2,"why":"Ventilatory control reflects neural and chemical inputs including increased CO2 production.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":6},{"id":"new-013","topic":"A1.2","stem":"Which relationship is described by the Fick equation for oxygen uptake?","options":["Ventilation multiplied by lactate concentration","Cardiac output times arteriovenous oxygen difference","Oxygen saturation divided by blood pressure","Heart rate divided by stroke volume"],"correct":1,"why":"VO2 = cardiac output × (arterial O2 content − venous O2 content).","source":"Original UKSCA-style practice (not official)","paper":"new1","n":7},{"id":"new-014","topic":"A1.2","stem":"What is a likely chronic response to endurance training?","options":["Reduced mitochondrial enzyme capacity","Reduced blood plasma volume","Lower maximal stroke volume","Increased skeletal muscle capillary density"],"correct":3,"why":"Endurance training promotes peripheral oxidative and capillary adaptations.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":7},{"id":"new-015","topic":"A1.2","stem":"During incremental exercise, ventilation rises disproportionately around the ventilatory threshold partly because of what?","options":["Complete cessation of aerobic metabolism","Increased CO2 from buffering exercise-related acid load","Instant exhaustion of all glycogen","Sudden absence of arterial oxygen"],"correct":1,"why":"Bicarbonate buffering contributes extra CO2, stimulating ventilation.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":8},{"id":"new-016","topic":"A1.2","stem":"Why can maximal heart rate remain similar after aerobic training despite improved VO2max?","options":["ATP supply becomes anaerobic only","Ventilation becomes irrelevant","HRmax must double with VO2max","Improvements often derive from stroke volume and oxygen extraction rather than a higher HRmax"],"correct":3,"why":"Maximal HR changes little with training, whereas maximal cardiac output and peripheral extraction can increase.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":8},{"id":"new-017","topic":"A1.2","stem":"Which statement about capillarisation is best supported?","options":["Capillarisation only adapts to sprint training","Capillaries generate mechanical force","More capillaries per fibre can improve exchange capacity and diffusion conditions","Capillary number must always fall as fibre size increases"],"correct":2,"why":"Capillary adaptations support oxygen delivery and exchange in trained muscle.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":9},{"id":"new-018","topic":"A1.2","stem":"At rest, which part of the cardiac cycle allows ventricular filling?","options":["Ventricular systole","Diastole","Isovolumetric contraction only","Ejection phase only"],"correct":1,"why":"Ventricular relaxation and filling occur in diastole.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":9},{"id":"new-019","topic":"A1.3","stem":"A motor unit consists of which structures?","options":["One alpha motor neuron and the skeletal muscle fibres it innervates","A single actin filament","One muscle fibre and all nearby neurons","A tendon and a ligament"],"correct":0,"why":"The alpha motor neuron and all its innervated muscle fibres constitute a motor unit.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":10},{"id":"new-020","topic":"A1.3","stem":"What is the size principle of motor-unit recruitment?","options":["All units activate simultaneously at any intensity","Fast units are always recruited first","Recruitment depends only on limb length","Lower-threshold units are generally recruited before higher-threshold units as force demand rises"],"correct":3,"why":"Recruitment generally progresses with required neural drive and force.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":10},{"id":"new-021","topic":"A1.3","stem":"Which adaptation contributes strongly to early strength gains in novice lifters?","options":["Conversion of all type I fibres into IIx","Improved neural drive and coordination","More muscle fibre hyperplasia than hypertrophy","Large immediate increases in bone length"],"correct":1,"why":"Early gains commonly include neural coordination and recruitment changes.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":11},{"id":"new-022","topic":"A1.3","stem":"Which muscle fibre type is generally associated with the fastest shortening velocity?","options":["All fibre types have identical shortening velocity","Type IIx","Type I alone during sprinting","Type I"],"correct":1,"why":"Type IIx fibres have relatively fast contractile properties.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":11},{"id":"new-023","topic":"A1.3","stem":"Which outcome is a typical response to progressive resistance training?","options":["Increased muscle fibre cross-sectional area","Decreased protein synthesis in all muscles","Reduced tendon load capacity regardless of training","Complete elimination of type I fibres"],"correct":0,"why":"Mechanical loading can produce muscle hypertrophy and connective-tissue adaptation.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":12},{"id":"new-024","topic":"A1.3","stem":"What do muscle spindles primarily detect?","options":["Tendon tension exclusively","Muscle length and changes in length","External temperature","Blood oxygen content"],"correct":1,"why":"Muscle spindles contain sensory endings sensitive to muscle stretch.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":12},{"id":"new-025","topic":"A1.3","stem":"Where are Golgi tendon organs primarily located?","options":["Inside the muscle fibre nucleus","In the bone marrow","Within the retina","At the muscle–tendon junction"],"correct":3,"why":"Golgi tendon organs provide force/tension-related sensory information.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":13},{"id":"new-026","topic":"A1.3","stem":"What is meant by rate coding?","options":["Changing motor-unit discharge frequency to modify force","Converting ATP into creatine","Increasing only joint angular velocity","Changing muscle fibre number via cell division"],"correct":0,"why":"Higher firing frequencies can increase force, depending on activation and conditions.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":13},{"id":"new-027","topic":"A1.3","stem":"Which statement about tendon adaptation is best?","options":["Only aerobic training can affect tendon stiffness","Tendons always become weaker with resistance exercise","Tendons can adapt to sufficiently dosed mechanical loading","Tendons do not contain collagen"],"correct":2,"why":"Connective tissue remodels in response to habitual strain and loading.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":14},{"id":"new-028","topic":"A1.3","stem":"What is a neuromuscular junction?","options":["The interface between two bones","A junction between two ligaments","The attachment of fascia to skin","The synapse between a motor neuron terminal and a muscle fibre"],"correct":3,"why":"Acetylcholine release at the neuromuscular junction initiates muscle membrane excitation.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":14},{"id":"new-029","topic":"A1.3","stem":"What structural unit shortens during skeletal muscle contraction?","options":["Entire fascicle without any sarcomere change","Tendon","Motor neuron","Sarcomere"],"correct":3,"why":"Actin and myosin sliding changes sarcomere length.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":15},{"id":"new-030","topic":"A1.3","stem":"Which change would most likely increase maximal voluntary force after training?","options":["Reduced myofibrillar content","Less motor-unit recruitment","Greater muscle size combined with improved activation","Lower muscle activation and smaller physiological cross-section"],"correct":2,"why":"Neural and muscular adaptations can both improve force production.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":15},{"id":"new-031","topic":"A1.4","stem":"Which cell is chiefly responsible for bone resorption?","options":["Osteoclast","Chondrocyte","Osteoblast","Osteocyte"],"correct":0,"why":"Osteoclasts resorb mineralised bone matrix.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":16},{"id":"new-032","topic":"A1.4","stem":"Which cell produces new bone matrix?","options":["Platelet","Osteoblast","Erythrocyte","Osteoclast"],"correct":1,"why":"Osteoblasts synthesise osteoid that can subsequently mineralise.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":16},{"id":"new-033","topic":"A1.4","stem":"What is the main role of osteocytes in mechanical adaptation?","options":["Producing oxygen in bone marrow","Contracting to move joints","Sensing mechanical strain and helping regulate remodelling","Resorbing all bone regardless of load"],"correct":2,"why":"Osteocytes act as mechanosensors and signal to bone-remodelling cells.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":17},{"id":"new-034","topic":"A1.4","stem":"Which tissue forms the dense outer shell of most bones?","options":["Cortical (compact) bone","Articular cartilage","Spongy trabecular tissue only","Adipose tissue"],"correct":0,"why":"Cortical bone provides the dense, load-bearing shell around many bones.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":17},{"id":"new-035","topic":"A1.4","stem":"Which loading exposure is most osteogenic for a previously untrained person?","options":["Only very low strain repetitive movement","Complete prolonged unloading","A single session without any further stimulus","Appropriate progressive, high-strain or impact loading with recovery"],"correct":3,"why":"Bone responds to adequate novel mechanical strains with time for remodelling.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":18},{"id":"new-036","topic":"A1.4","stem":"What may happen to bone mineral density after prolonged unloading?","options":["It may decline due to a relative increase in resorption","It becomes unrelated to mechanical loading","Bone cannot respond to unloading","It must increase because bones recover"],"correct":0,"why":"Reduced mechanical stimulation can lead to net bone loss.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":18},{"id":"new-037","topic":"A1.4","stem":"What type of bone has a porous lattice-like architecture and high surface area for turnover?","options":["Cortical shell exclusively","Tendon","Meniscus","Trabecular bone"],"correct":3,"why":"Trabecular or cancellous bone has interconnected struts and high remodelling potential.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":19},{"id":"new-038","topic":"A1.4","stem":"What does the 'minimum effective strain' concept imply?","options":["Bone adaptation depends on loading exceeding a sufficient stimulus threshold","Every load has an identical bone response","Repeated zero-strain exposures cause maximal growth","Bone improves solely from energy intake"],"correct":0,"why":"The bone response depends on magnitude, rate, distribution and novelty of strain.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":19},{"id":"new-039","topic":"A1.5","stem":"What acute adaptation to high altitude occurs in healthy athletes?","options":["Increased oxygen partial pressure compared with sea level","Immediate doubling of haemoglobin mass","Increased ventilation in response to reduced inspired oxygen pressure","Complete removal of cardiovascular strain"],"correct":2,"why":"Hypoxic ventilatory drive increases with reduced atmospheric oxygen pressure.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":20},{"id":"new-040","topic":"A1.5","stem":"What is a common consequence of exercising in hot, humid conditions?","options":["Lower sweat requirements at the same heat load","No change in thermal strain","More efficient evaporation than dry air","Greater difficulty evaporating sweat"],"correct":3,"why":"High humidity reduces the water-vapour gradient, constraining evaporative cooling.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":20},{"id":"new-041","topic":"A1.5","stem":"What does heat acclimation typically improve?","options":["Instant immune protection against illness","Elimination of sweating entirely","Maximal strength doubling","Sweating and cardiovascular stability for a given heat load"],"correct":3,"why":"Repeated heat exposures can improve sweat response and reduce physiological strain.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":21},{"id":"new-042","topic":"A1.5","stem":"When travelling east across many time zones, which outcome is usually more challenging?","options":["Advancing the circadian clock earlier","Avoiding any sleep changes","Preventing jet lag by staying awake all week","Delaying the clock later"],"correct":0,"why":"Phase advances are commonly harder than phase delays.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":21},{"id":"new-043","topic":"A1.5","stem":"Why can severe cold impair fine motor skill performance?","options":["Increased muscle temperature above normal","Automatic rise in tendon elasticity","Reduced peripheral temperature and dexterity","Removal of all proprioceptive input"],"correct":2,"why":"Cooling can slow nerve conduction and reduce dexterity.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":22},{"id":"new-044","topic":"A1.5","stem":"At a fixed absolute work rate at altitude, which physiological adjustment is likely?","options":["Higher relative cardiovascular and ventilatory strain","Lower relative intensity under all conditions","Complete cessation of breathing adaptation","Unchanged oxygen availability"],"correct":0,"why":"Reduced inspired PO2 increases relative strain and may reduce performance.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":22},{"id":"new-045","topic":"A2.1","stem":"In which anatomical plane does a biceps curl mainly occur?","options":["Transverse","Frontal","Oblique only","Sagittal"],"correct":3,"why":"Elbow flexion and extension are primarily sagittal-plane movements.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":23},{"id":"new-046","topic":"A2.1","stem":"Around which axis does flexion–extension primarily occur?","options":["No axis","Anteroposterior axis","Mediolateral axis","Vertical longitudinal axis"],"correct":2,"why":"Sagittal-plane movement occurs around a mediolateral axis.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":23},{"id":"new-047","topic":"A2.1","stem":"Which movement mainly occurs in the frontal plane?","options":["Elbow flexion","Hip abduction","Trunk axial rotation","Knee flexion"],"correct":1,"why":"Abduction and adduction are primarily frontal-plane movements.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":24},{"id":"new-048","topic":"A2.1","stem":"How is forearm pronation best described?","options":["Shoulder horizontal abduction","Rotating the radius across the ulna to turn the palm posteriorly or down","Wrist flexion","Elbow hyperextension"],"correct":1,"why":"Pronation is forearm rotation at the radioulnar joints.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":24},{"id":"new-049","topic":"A2.1","stem":"What joint class describes the glenohumeral shoulder?","options":["Fibrous suture","Pivot only","Hinge only","Synovial ball-and-socket"],"correct":3,"why":"Ball-and-socket joints permit movements across multiple planes.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":25},{"id":"new-050","topic":"A2.1","stem":"At the ankle, dorsiflexion and plantarflexion occur primarily in which plane?","options":["Frontal","Sagittal","All three equally","Transverse"],"correct":1,"why":"Dorsiflexion and plantarflexion are sagittal-plane actions.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":25},{"id":"new-051","topic":"A2.1","stem":"Which is a primary movement of the hip during ascending from the bottom of a squat?","options":["Hip internal rotation only","Hip flexion","Hip abduction only","Hip extension"],"correct":3,"why":"Hip and knee extensors contribute to rising from the squat.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":26},{"id":"new-052","topic":"A2.1","stem":"What does the transverse plane principally divide the body into?","options":["Superior and inferior parts","Left and right parts","Anterior and posterior parts","Medial and lateral regions only"],"correct":0,"why":"The transverse plane is horizontal and separates upper from lower.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":26},{"id":"new-053","topic":"A2.1","stem":"Which axis is associated with frontal-plane movements?","options":["Longitudinal axis only","No axis","Mediolateral axis","Anteroposterior axis"],"correct":3,"why":"Frontal-plane actions occur around a front-to-back axis.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":27},{"id":"new-054","topic":"A2.1","stem":"Which joint movement occurs during the eccentric lowering phase of a squat?","options":["Hip and knee extension","Hip and knee flexion","Elbow pronation","Shoulder horizontal adduction"],"correct":1,"why":"The body lowers through increasing hip and knee flexion.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":27},{"id":"new-055","topic":"A2.2","stem":"During the upward phase of a squat, the quadriceps mainly perform what action at the knee?","options":["No action","Concentric knee extension","Eccentric knee flexion","Isometric knee flexion"],"correct":1,"why":"Knee extensors shorten to extend the knee in ascent.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":28},{"id":"new-056","topic":"A2.2","stem":"During controlled lowering into a squat, the quadriceps mainly perform what contraction?","options":["Eccentric","Only isometric","No contraction","Concentric"],"correct":0,"why":"The knee extensors produce force while lengthening to control flexion.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":28},{"id":"new-057","topic":"A2.2","stem":"Which muscle is a major prime mover of hip extension?","options":["Tibialis anterior","Gluteus maximus","Biceps brachii","Rectus abdominis"],"correct":1,"why":"Gluteus maximus provides substantial hip extension torque.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":29},{"id":"new-058","topic":"A2.2","stem":"Which muscle is principally responsible for ankle plantarflexion?","options":["Tibialis anterior","Gastrocnemius–soleus complex","Biceps femoris short head","Rectus femoris"],"correct":1,"why":"Triceps surae muscles generate substantial plantarflexor torque.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":29},{"id":"new-059","topic":"A2.2","stem":"What role do the scapular retractors play during a bent-over row?","options":["Pronate the ankle","Flex the hip","Extend the knee","Retract and stabilise the scapulae"],"correct":3,"why":"Rhomboids and middle trapezius support scapular retraction.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":30},{"id":"new-060","topic":"A2.2","stem":"Which is the defining feature of an isometric contraction?","options":["Muscle produces zero force","Muscle always lengthens","Muscle always shortens","Muscle produces force without appreciable joint movement"],"correct":3,"why":"Isometric action holds length or joint position approximately constant while producing tension.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":30},{"id":"new-061","topic":"A2.2","stem":"In a Nordic hamstring exercise, hamstrings predominantly resist forward falling through which action?","options":["Shoulder flexion","Ankle dorsiflexion","Concentric knee extension","Eccentric knee-flexor action"],"correct":3,"why":"The hamstrings resist knee extension while lengthening under tension.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":31},{"id":"new-062","topic":"A2.3","stem":"Which sensory receptor primarily detects tension developed in a muscle–tendon unit?","options":["Hair cell of cochlea","Photoreceptor","Golgi tendon organ","Pulmonary stretch receptor"],"correct":2,"why":"Golgi tendon organs sense changes in musculotendinous tension.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":31},{"id":"new-063","topic":"A2.3","stem":"Which peripheral structure transmits sensory information towards the central nervous system?","options":["Efferent alpha motor neuron only","Tendon collagen fibril","Afferent neuron","Motor end plate only"],"correct":2,"why":"Afferent neurons carry sensory signals to the CNS.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":32},{"id":"new-064","topic":"A2.3","stem":"Which structure carries motor commands from the CNS to skeletal muscle?","options":["Ligament","Afferent receptor terminal alone","Osteocyte","Efferent motor neuron"],"correct":3,"why":"Motor efferents carry impulses from motor pathways to muscle.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":32},{"id":"new-065","topic":"A2.3","stem":"What increases conduction velocity along many peripheral axons?","options":["Reduced axon diameter alone","Loss of myelin","Reduced membrane integrity","Myelination and larger axon diameter"],"correct":3,"why":"Saltatory conduction and axon diameter improve conduction speed.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":33},{"id":"new-066","topic":"A2.3","stem":"Which reflex directly supports rapid resistance to unexpected muscle stretch?","options":["Stretch (myotatic) reflex","Pupillary light reflex","Cough reflex","Vestibulo-ocular reflex only"],"correct":0,"why":"Spindle afferents can excite homonymous motor neurons through spinal pathways.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":33},{"id":"new-067","topic":"A2.3","stem":"Which nervous system structure is central to coordination and motor-error correction?","options":["Spleen","Thyroid gland","Femur","Cerebellum"],"correct":3,"why":"The cerebellum contributes to timing, coordination and sensorimotor error processing.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":34},{"id":"new-068","topic":"A2.3","stem":"What is feedforward motor control?","options":["Anticipatory commands based on prediction before feedback can correct action","Solely reflexive tendon response","Correction only after an unexpected sensory signal","Only visual feedback tracking"],"correct":0,"why":"Feedforward control plans motor actions in advance.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":34},{"id":"new-069","topic":"A2.3","stem":"What is a closed-loop motor control strategy?","options":["A response driven exclusively by stored ATP","Zero involvement of the nervous system","Movement adjustments informed by ongoing sensory feedback","Movement planned with no use of feedback"],"correct":2,"why":"Closed-loop regulation compares intended and observed state and corrects error.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":35},{"id":"new-070","topic":"A2.3","stem":"Which proprioceptive input most directly informs the CNS about muscle length?","options":["Liver chemoreceptors","Osteoblasts","Sweat glands","Muscle spindles"],"correct":3,"why":"Muscle spindle afferents encode length and velocity information.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":35},{"id":"new-071","topic":"A2.3","stem":"What is the effect of reciprocal inhibition in a simple joint movement?","options":["Every motor neuron is silenced","Proprioceptors stop sensing stretch","Reduced antagonist activity facilitates agonist action","Both agonist and antagonist must become maximally active"],"correct":2,"why":"Spinal inhibitory circuits can reduce antagonist motor drive as the agonist acts.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":36},{"id":"new-072","topic":"A3.1","stem":"In a fitness–fatigue model, why might performance briefly fall after a demanding training block?","options":["Fitness always falls after training","Accumulated fatigue temporarily masks fitness gains","Bone remodelling ends permanently","Training has no positive adaptations"],"correct":1,"why":"Performance reflects fitness benefits and acute fatigue costs.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":36},{"id":"new-073","topic":"A3.1","stem":"Which statement describes progressive overload?","options":["Always increasing exercise variety but never load","Keeping every stimulus unchanged forever","Systematically increasing training demands as adaptation occurs","Training maximally every day without recovery"],"correct":2,"why":"A progressively challenging stimulus is needed for continued adaptation.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":37},{"id":"new-074","topic":"A3.1","stem":"How is a microcycle usually defined in periodisation?","options":["Single repetition","Short training cycle often around one week","Whole annual plan","Entire multi-year career"],"correct":1,"why":"Microcycles are short organisational units within mesocycles and macrocycles.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":37},{"id":"new-075","topic":"A3.1","stem":"A mesocycle is best understood as what?","options":["A multi-week block with a training emphasis","A single warm-up exercise","The entire sporting lifetime","One training set"],"correct":0,"why":"Mesocycles usually group multiple microcycles around an adaptation goal.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":38},{"id":"new-076","topic":"A3.1","stem":"Why can deloading improve performance following a high training load?","options":["It eliminates any need for recovery","Fatigue dissipates while some fitness is retained","Training must always be maximal to improve","All physiological adaptations vanish immediately"],"correct":1,"why":"Reducing load can permit expression of accrued fitness.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":38},{"id":"new-077","topic":"A3.1","stem":"Which training principle explains why improved maximal strength does not guarantee identical gains in long-duration aerobic capacity?","options":["Specificity","Regression to the mean","Random variation only","Chronobiology only"],"correct":0,"why":"Adaptations are shaped by the physiological and biomechanical demands of training.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":39},{"id":"new-078","topic":"A3.1","stem":"What is the main risk of increasing load too rapidly?","options":["Guaranteed maximal adaptation","Full immunity to fatigue","Permanent elevation of all performances","Inadequate recovery and elevated injury or maladaptation risk"],"correct":3,"why":"Load progression should respect tolerance, adaptation and recovery.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":39},{"id":"new-079","topic":"A3.1","stem":"In a traditional annual plan, what is the macrocycle?","options":["The largest overarching training cycle","A single repetition","A set of identical jumps","A short bout of mobility"],"correct":0,"why":"Macrocycles comprise longer planned periods, often a season or year.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":40},{"id":"new-080","topic":"A3.1","stem":"Why should exercise order place demanding technical power activities early in a session?","options":["Technical performance is best when highly fatigued","Recovery is impossible between sets","Better quality when fatigue is lower","Power does not require neural coordination"],"correct":2,"why":"Complex, high-speed or high-skill activities often benefit from a fresh state.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":40},{"id":"new-081","topic":"A3.1","stem":"What is the difference between volume and intensity in resistance training?","options":["Intensity is always repetitions multiplied by sets","Both mean exclusively session duration","Both mean only exercise selection","Volume reflects work quantity while intensity indicates load or effort"],"correct":3,"why":"Volume and intensity are separate programme variables that interact.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":41},{"id":"new-082","topic":"A3.1","stem":"What is 'functional overreaching' in training?","options":["Failure of all recovery strategies","Zero fatigue training","A planned temporary performance decrement followed by recovery and possible supercompensation","Permanent overtraining syndrome"],"correct":2,"why":"Planned short-term overload can yield improvements after adequate recovery.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":41},{"id":"new-083","topic":"A3.2","stem":"Which property of a test describes consistency of repeated scores under similar conditions?","options":["Reliability","Specificity alone","Construct novelty","Popularity"],"correct":0,"why":"Reliability reflects reproducibility of measurement.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":42},{"id":"new-084","topic":"A3.2","stem":"Which property addresses whether a test measures the intended quality?","options":["Cost alone","Validity","Test length alone","Familiarity only"],"correct":1,"why":"Validity concerns the interpretation of a test as measuring its intended construct.","source":"Original UKSCA-style practice (not official)","paper":"new2","n":42},{"id":"new-085","topic":"A3.2","stem":"Why should test protocols be standardised?","options":["To reduce extraneous variation across sessions","To remove the need for calibration","To make every athlete achieve identical scores","To improve only visual appeal"],"correct":0,"why":"Consistent conditions improve comparability and reliability.","source":"Original UKSCA-style practice (not official)","paper":"new1","n":43},{"id":"new-086","topic":"A3.2","stem":"Which test is most suitable to assess explosive lower-limb jump performance?"," ation","All bone cells permanently stop remodelling","Bone cells become less responsive to familiar repetitive loading"],"correct":3,"why":"Bone adaptation depends partly on novel and sufficiently intense mechanical signals.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new6","n":73},{"id":"original-mock-074","topic":"A1.4","stem":"What is Wolff's law broadly used to describe?","options":["Glycolytic ATP synthesis","Cardiac output regulation","Motor-unit recruitment order","Functional adaptation of bone to mechanical stress"],"correct":3,"why":"Wolff's law summarises the relationship between mechanical loading and bone architecture.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new4","n":74},{"id":"original-mock-075","topic":"A1.5","stem":"At high altitude, what primarily reduces the partial pressure of inspired oxygen?","options":["Lower barometric pressure","Greater oxygen molecular weight","Higher humidity alone","A lower percentage of oxygen in dry air"],"correct":0,"why":"Atmospheric oxygen fraction is roughly constant; total barometric pressure declines.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new6","n":75},{"id":"original-mock-076","topic":"A1.5","stem":"Which acute respiratory response commonly occurs after ascent to altitude?","options":["Reduced breathing despite hypoxia","Increased ventilation","Immediate doubling of red-cell mass","Complete absence of sympathetic activation"],"correct":1,"why":"Hypoxaemia stimulates ventilation through peripheral chemoreceptors.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new6","n":76},{"id":"original-mock-077","topic":"A1.5","stem":"Which longer-term adaptation may increase oxygen-carrying capacity at altitude?","options":["Increased haemoglobin mass","Complete loss of erythropoietin secretion","Reduced red-cell production n of limb position and movement based on somatosensory information.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new4","n":129},{"id":"original-mock-130","topic":"A2.3","stem":"Which CNS region is important for movement coordination and error correction?","options":["Hypothalamus only","Medulla exclusively","Cerebellum","Corpus callosum exclusively"],"correct":2,"why":"The cerebellum contributes to motor coordination, adaptation and error-based learning.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new5","n":130},{"id":"original-mock-131","topic":"A2.3","stem":"Which sensory system helps maintain equilibrium during head rotation?","options":["Muscle spindle in biceps only","Vestibular semicircular canals","Olfactory bulb","Optic disc"],"correct":1,"why":"Semicircular canals detect rotational head movements.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new3","n":131},{"id":"original-mock-132","topic":"A2.3","stem":"What does a closed-loop motor-control system use?","options":["Bone remodelling after training","Random motor commands only","Sensory feedback to correct ongoing action","Execution without any feedback"],"correct":2,"why":"Closed-loop control compares actual with desired state and corrects using feedback.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new4","n":132},{"id":"original-mock-133","topic":"A2.3","stem":"What does open-loop motor control emphasise?","options":["Skeletal remodelling","No efferent motor signal","Pre-programmed feedforward action","Continuous feedback corrections at every millisecond"],"correct":2,"why":"Open-loop actions rely on pre-planned motor commands with limited correction during execution.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new3","n":133},{"id":"original-mock-134","topic":"A2.3","stem":"What is feedforward control?","options":["Blood-flow autoregulation","Error correction only after the movement","Passive tendon compression","Anticipatory motor commands"],"correct":3,"why":"Feedforward control prepares actions in advance using prediction.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new5","n":134},{"id":"original-mock-135","topic":"A2.3","stem":"What does the myelin sheath most directly affect?","options":["Conduction velocity","Capillary oxygen saturation","Bone mineral density directly","Muscle fibre cross-sectional area directly"],"correct":0,"why":"Myelin enables rapid saltatory impulse conduction.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new6","n":135},{"id":"original-mock-136","topic":"A2.3","stem":"How does increasing axon diameter generally affect action-potential propagation speed?","options":["Only muscle fibre length matters","Larger diameter reduces internal electrical resistance","Smaller diameter always conducts faster","Diameter has no effect on electrical properties"],"correct":1,"why":"Larger axons typically have lower axial resistance and faster propagation.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new5","n":136},{"id":"original-mock-137","topic":"A2.3","stem":"What is an alpha motor neuron?","options":["Osteocyte","Type Ia sensory receptor","Alpha motor neuron","Gamma sensory neuron"],"correct":2,"why":"Alpha motor neurons activate extrafusal fibres responsible for force generation.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new4","n":137},{"id":"original-mock-138","topic":"A2.3","stem":"What is a gamma motor neuron?","options":["Cortical interneuron only","Gamma motor neuron","Alpha motor neuron only","Type II sensory fibre only"],"correct":1,"why":"Gamma motor neurons activate intrafusal fibres and help maintain spindle sensitivity.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new4","n":138},{"id":"original-mock-139","topic":"A2.3","stem":"What is a motor programme?","options":["One fixed heart-rate response","The rate of lactate clearance alone","A new bone matrix protein","Stored or structured movement command pattern"],"correct":3,"why":"Motor programmes describe organised control structures that help generate coordinated movement.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new6","n":139},{"id":"original-mock-140","topic":"A2.3","stem":"What is reaction time?","options":["Peak force divided by body mass","Total distance travelled","Time from stimulus onset to movement initiation","Time from movement onset to completion"],"correct":2,"why":"Reaction time measures delay between stimulus and initiation of response.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new5","n":140},{"id":"original-mock-141","topic":"A2.3","stem":"Which sensory organ contributes to detecting linear head acceleration and tilt?","options":["Retina alone","Otolith organs","Semicircular canals alone","Spinal motor neurons"],"correct":1,"why":"The utricle and saccule detect linear acceleration and gravity-relative tilt.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new6","n":141},{"id":"original-mock-142","topic":"A3.1","stem":"Which training principle requires matching adaptations to the demands of a task?","options":["Randomisation","Specificity","Reversibility","Accommodation alone"],"correct":1,"why":"Adaptation is specific to the imposed demands, including movement and energy-system characteristics.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new4","n":142},{"id":"original-mock-143","topic":"A3.1","stem":"What does progressive overload mean?","options":["Maximising every variable in one session","Removing all recovery","Gradually increasing an appropriate training stimulus","Keeping loads unchanged indefinitely"],"correct":2,"why":"Progressive overload adjusts stimulus over time as capacity develops.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new5","n":143},{"id":"original-mock-144","topic":"A3.1","stem":"What is the reversibility principle?","options":["Reversibility","Accommodation to high load","Supercompensation alone","Specificity only"],"correct":0,"why":"Training effects may regress when stimulus is reduced or removed.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new6","n":144},{"id":"original-mock-145","topic":"A3.1","stem":"What is periodisation?","options":["Planned variation in training across time","Replacing all individualisation with fixed rules","Repeating the same session regardless of fatigue","Always training maximally every day"],"correct":0,"why":"Periodisation arranges training loads and emphases over defined cycles.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new5","n":145},{"id":"original-mock-146","topic":"A3.1","stem":"What is a microcycle?","options":["Olympic quadrennium","Annual competition cycle","Microcycle","Macrocycle"],"correct":2,"why":"Microcycles commonly cover around a week, although lengths vary.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new6","n":146},{"id":"original-mock-147","topic":"A3.1","stem":"What is a mesocycle?","options":["Mesocycle","One warm-up set","Macrocycle exclusively","Single training repetition"],"correct":0,"why":"A mesocycle commonly spans several microcycles in a focused block.","source":"Original UKSCA-style questions (not official UKSCA papers)","kind":"mock","paper":"new3","n":147},{"id":"original-mock-148","topic":"A3.1","stem":"What is a macrocycle?","optio
