<div class="section-title"><h2>Where to focus next</h2><button class="btn small ghost" onclick="go('practice')">Open adaptive practice →</button></div><div class="twocol"><div class="panel"><div class="row" style="margin-bottom:10px"><h3>Knowledge map</h3><span class="muted small">Historical baseline → new evidence</span></div>${wk.map(c=>{const s=topicStats(c);return `<div class="topicrow"><div class="tag">${c}</div><div><strong>${esc(TOPICS[c].title)}</strong><div class="labeldesc">${s.a.length?`New: ${fmtPct(s.recentAcc)} from ${s.a.length} recent answers`:'Awaiting new answers'}</div></div><div class="score">${fmtPct(s.baseAcc)}</div><div class="lastcol"><span class="badge ${s.mastered?'good':s.a.length>=3&&s.recentAcc<.65?'danger':''}">${s.label}</span></div></div>`}).join('')}</div><div class="stack"><div class="panel"><h3>Next recommended revision</h3><div class="kicker" style="margin:15px 0 3px">PRIORITY · ${wk[0]}</div><h2 style="margin:0 0 6px;font-size:22px">${esc(TOPICS[wk[0]].title)}</h2><p class="muted">${esc(TOPICS[wk[0]].core[0])}</p><div class="actions"><button class="btn primary" onclick="openLesson('${wk[0]}')">Study this</button><button class="btn" onclick="startDrill('${wk[0]}')">Test this</button></div></div><div class="panel"><h3>Readiness rule</h3><p class="muted small">Aim for <b>43+/50 on your latest three distinct original mocks</b> and <b>80%+ on at least 5 recent questions</b> per competency over at least two dates. These are conservative personal training criteria, not official UKSCA requirements.</p><div class="track"><i style="width:${Math.round(rs.strong*100/13)}%"></i></div><div class="muted small" style="margin-top:9px">${rs.strong} of 13 competencies meeting your retention criterion</div></div></div></div>
<div class="section-title"><h2>Anytime: random 10-question quiz</h2><button class="btn small ghost" onclick="go('quick')">Open quiz page →</button></div><div class="panel row"><div><b>Never run out of practice</b><div class="muted small">300 questions available from day one; unattempted mock questions stay unseen.</div></div><button class="btn primary" onclick="startQuickQuiz()">Start random 10 →</button></div><div class="section-title"><h2>Recent mock history</h2><button class="btn small ghost" onclick="go('mocks')">All mock exams →</button></div><div class="panel">${runHtml}</div><p class="footnote">Historical competency percentages reflect your four previously marked papers. They are not treated as current mastery. Saved locally in this browser; export a backup in Documents.</p>`}
function setDayPart(date,part,checked){model.sessions[date]??={};model.sessions[date][part]=checked;save();render()}
function openDay(date){model.selectedDay=date;save();view='schedule';render();document.getElementById('dayDetails')?.scrollIntoView({behavior:'smooth',block:'start'});}
function schedule(){const d=dayFromDate(model.selectedDay);const s=model.sessions[d.date]||{};const topic=TOPICS[d.topic];return `<div class="kicker">Your 22-day programme</div><h1 class="page-title">Daily schedule</h1><p class="lead">13 November to 4 December 2026. Every day has 45 minutes of core work; full 60-minute mocks are additional. Daily practice adapts using your answers and confidence.</p><div class="panel"><h3 style="margin-bottom:15px">November — December 2026</h3><div class="day-grid">${PLAN.map(x=>`<button class="daybox ${hasCompleted(x.date)?'completed':''} ${d.date===x.date?'current':''}" onclick="chooseDay('${x.date}')"><div class="ddate">${x.date.slice(5).replace('-','/')}</div><div class="dnum">${x.index<10?'0':''}${x.index}</div><div class="ddate">${x.topic}</div><div class="check">${hasCompleted(x.date)?'✓ COMPLETE':x.extraMock?'＋ FULL MOCK':''}</div></button>`).join('')}</div></div>
<div class="section-title" id="dayDetails"><h2>Day ${d.index} · ${esc(d.title)}</h2><span class="pill secondary">45 MIN</span></div><div class="twocol"><div class="panel"><div class="flexgap"><span class="tag">${d.topic}</span><span class="badge">${d.date}</span></div><p class="muted">${esc(d.detail)}</p><div class="todayline"><span class="numcircle">05</span><div><b>Retrieve and space</b><div class="small muted">Answer your due questions without notes, then check the correct mechanism.</div><label class="toggle"><input type="checkbox" ${s.recall?'checked':''} onchange="setDayPart('${d.date}','recall',this.checked)">Completed</label></div></div><div class="todayline"><span class="numcircle">20</span><div><b>Learn and read</b><div class="small muted">${esc(d.reading)}. Use the lesson checklist and linked textbook pages.</div><button class="btn small" onclick="openLesson('${d.topic}')">Open lesson + reading</button><label class="toggle" style="margin-left:10px"><input type="checkbox" ${s.read?'checked':''} onchange="setDayPart('${d.date}','read',this.checked)">Completed</label></div></div><div class="todayline"><span class="numcircle">15</span><div><b>Adaptive questions</b><div class="small muted">Up to 10 questions from your weak topics, with explanation and confidence recording.</div><button class="btn small" onclick="startDrill('${d.topic}')">Start adaptive MCQs</button><label class="toggle" style="margin-left:10px"><input type="checkbox" ${s.quiz?'checked':''} onchange="setDayPart('${d.date}','quiz',this.checked)">Completed</label></div></div><div class="todayline"><span class="numcircle">05</span><div><b>Explain, correct, commit to memory</b><div class="small muted">Write your rule in your own words. Revisits will be scheduled automatically from quiz responses.</div><button class="btn small" onclick="openLesson('${d.topic}')">Make recall notes</button><label class="toggle" style="margin-left:10px"><input type="checkbox" ${s.reflection?'checked':''} onchange="setDayPart('${d.date}','reflection',this.checked)">Completed</label></div></div><div class="notice" style="margin-top:15px">${hasCompleted(d.date)?'✓ All four components marked complete.':'Complete the four components to tick this day off. Checking a box marks a task done; knowledge mastery requires correct answers over time.'}</div></div><div class="stack"><div class="panel"><h3>Textbook for this day</h3><div class="muted">${esc(d.reading)}</div><div class="actions"><a href="resources/Essentials of Strength Training and Conditioning 3.pdf#page=${d.readingPage+14}" target="_blank" class="btn primary" style="text-decoration:none">Open at chapter page ↗</a><a href="resources/UKSCA Competency Document.pdf" target="_blank" class="btn" style="text-decoration:none">Competency PDF</a></div></div>${d.extraMock?`<div class="panel" style="border-color:#779660"><div class="kicker">EXTRA SESSION · 60 MINUTES</div><h3>${esc(DATA.mocks[d.extraMock].name)}</h3><p class="small muted">This full mock is additional to your 45-minute revision. It is timed at 60 minutes and feeds results into your knowledge tracker.</p><button class="btn primary" onclick="launchMock('${d.extraMock}')">Open full mock →</button></div>`:''}<div class="panel"><h3>Other dates</h3><p class="muted small">The topic sequence stays fixed to cover all 13 assessed competencies. Your question practice and recommended weak topics change as you answer.</p><button class="btn ghost small" onclick="chooseDay('${currentDay().date}')">Jump to current session</button></div></div></div><div class="section-title"><h2>Full 22-day outline</h2></div><div class="timeline">${PLAN.map(x=>`<div class="timeline-card ${d.date===x.date?'active':''}"><div class="day-date">${String(x.index).padStart(2,'0')}<div class="muted small">${x.date.slice(5)}</div></div><div><h3>${esc(x.title)}</h3><p>${x.topic} · 45 min core ${x.extraMock?'· +60 min mock':''}</p></div><div class="cta"><button class="btn small" onclick="chooseDay('${x.date}')">View ↗</button></div></div>`).join('')}</div>`}
function chooseDay(date){model.selectedDay=date;save();render();document.getElementById('dayDetails')?.scrollIntoView({behavior:'smooth',block:'start'})}
function openLesson(topic){lessonTopic=topic;view='learn';model.selectedTopic=topic;save();render();window.scrollTo({top:0,behavior:'instant'})}
function learn(){const c=model.selectedTopic||lessonTopic,t=TOPICS[c],st=topicStats(c),isRead=!!model.topicRead[c];return `<div class="kicker">Short lessons + textbook reading</div><h1 class="page-title">Learn, then retrieve</h1><p class="lead">These guided lessons cover every competency marked “Multiple choice exam” in your uploaded UKSCA document. Use the notes for orientation, then read the specific textbook pages and test recall without looking.</p><div class="topic-tabs">${codes.map(code=>`<button class="topic-tab ${c===code?'selected':''}" onclick="selectTopic('${code}')">${code}</button>`).join('')}</div><div class="twocol"><div class="panel"><div class="flexgap"><span class="tag">${c}</span><span class="badge">${t.group}</span><span class="badge ${st.mastered?'good':''}">${st.label}</span></div><h2 style="font-size:26px;letter-spacing:-.7px;margin:8px 0 8px">${esc(t.title)}</h2><p class="muted">Textbook: <b>${esc(t.book)}</b>. These are condensed checkpoints; reading the chapter sections provides the detailed explanation.</p><div class="section-title" style="margin-top:22px"><h2>What you must understand</h2></div>${t.core.map((x,i)=>`<div class="lessonblock"><b>${String(i+1).padStart(2,'0')}.</b> ${esc(x)}</div>`).join('')}<div class="readback">✎ Your challenge: explain each point aloud without viewing the page. If you can only recognise the answer, it is not yet secure.</div><div class="actions"><a href="resources/Essentials of Strength Training and Conditioning 3.pdf#page=${t.pages[0]+14}" target="_blank" class="btn primary" style="text-decoration:none">Read textbook ↗</a><button class="btn" onclick="toggleTopicRead('${c}')">${isRead?'✓ Reading covered':'Mark reading covered'}</button><button class="btn" onclick="startDrill('${c}')">Test this topic</button></div></div><div class="stack"><div class="panel"><h3>Closed-book retrieval prompts</h3>${t.recall.map((r,i)=>`<div class="recall"><div class="small" style="color:var(--blue)">RECALL ${i+1}</div><b>${esc(r)}</b></div>`).join('')}<p class="muted small">If you hesitate, re-read the exact relevant paragraphs. Repeat tomorrow and 3–7 days later.</p></div><div class="panel"><h3>My explanation / error notebook</h3><p class="small muted">Write the mechanism, rule or distinction you keep missing. This stays saved in your browser.</p><textarea class="textarea" id="note" placeholder="What would I teach a coach about this topic?">${esc(model.topicNotes[c]||'')}</textarea><div class="actions"><button class="btn primary" onclick="saveNote('${c}')">Save note</button><button class="btn ghost" onclick="copyNote('${c}')">Copy</button></div></div><div class="panel"><h3>Current competency evidence</h3><p class="small muted">Historical: ${st.base.correct}/${st.base.total} (${fmtPct(st.baseAcc)})<br>Last ${st.a.length} new answers: ${st.a.length?fmtPct(st.recentAcc):'none yet'}<br>Distinct days tested: ${st.distinct}<br>Reading: ${isRead?'Covered':'Not yet marked'}</p><div class="track"><i style="width:${Math.round((st.recentAcc??0)*100)}%"></i></div></div></div></div>`}
function selectTopic(c){model.selectedTopic=c;save();render()}
function toggleTopicRead(c){model.topicRead[c]=!model.topicRead[c];save();render()}
function saveNote(c){model.topicNotes[c]=document.getElementById('note').value;save();render()}
function copyNote(c){const s=document.getElementById('note').value;navigator.clipboard?.writeText(s).then(()=>alert('Copied.')).catch(()=>alert('Select and copy the text manually.'))}
function failuresAll(){return new Set(model.attempts.filter(a=>!a.correct).map(a=>a.qid)).size}
function eligiblePool(){return QS.filter(q=>q.kind==='quiz'||q.source==='Supplied UKSCA sample paper'||model.mockRuns.some(r=>r.paper===q.paper))}
function pickDrill(focus,count=10){const pool=eligiblePool(),recentIds=new Set(model.attempts.slice(-5).map(a=>a.qid));const due=new Set(reviewDue().map(q=>q.id));let weighted=pool.map(q=>{let last=latest(q.id),w=priority(q.topic)+Math.random()*1.5+(q.topic===focus?5:0);if(due.has(q.id))w+=4;if(last&&!last.correct)w+=3;if(last&&last.confidence!=='sure')w+=1;if(recentIds.has(q.id))w-=6;if(!last)w+=2;return {id:q.id,topic:q.topic,w}}).sort((a,b)=>b.w-a.w);let out=[],topicCounter={};for(const x of weighted){if(out.length>=count)break;const limit=x.topic===focus?6:3;if((topicCounter[x.topic]||0)>=limit)continue;out.push(x.id);topicCounter[x.topic]=(topicCounter[x.topic]||0)+1}return out;}
function startDrill(focus){model.selectedTopic=focus||getWeak()[0];setDrill(pickDrill(model.selectedTopic,10),model.selectedTopic)}
function setDrill(ids,focus){if(!ids.length){alert('No eligible questions in this queue yet. Try normal adaptive practice.');return}model.activeDrill={ids,index:0,selected:null,confidence:'unsure',feedback:false,score:0,focus,startedAt:now()};view='practice';save();render();window.scrollTo({top:0,behavior:'instant'})}
function startDueDrill(){let allowed=new Set(eligiblePool().map(q=>q.id));const ids=reviewDue().filter(q=>allowed.has(q.id)).slice(0,10).map(q=>q.id);setDrill(ids,'due review')}
function startErrorDrill(){const allowed=new Set(eligiblePool().map(q=>q.id));let ids=[];for(const a of [...model.attempts].reverse()){if(!a.correct&&allowed.has(a.qid)&&!ids.includes(a.qid))ids.push(a.qid);if(ids.length>=10)break}setDrill(ids,'mistake bank')}
function answerDrillOpt(n){if(!model.activeDrill||model.activeDrill.feedback)return;model.activeDrill.selected=n;save();render()}
function setDrillConfidence(v){if(!model.activeDrill)return;model.activeDrill.confidence=v;save()}
function submitDrill(){const x=model.activeDrill;if(!x||x.selected==null||x.feedback)return;const qid=x.ids[x.index];addAttempt(qid,x.selected,x.confidence,x.focus==='random quiz'?'quick':'adaptive','');if(x.selected===QBY[qid].correct)x.score++;x.feedback=true;save();render()}
function nextDrill(){const x=model.activeDrill;if(!x)return;x.index++;x.selected=null;x.feedback=false;x.confidence='unsure';save();render()}
function finishDrill(){const x=model.activeDrill;if(!x)return;
if(x.focus==='random quiz'){
 model.quickRuns??=[];model.quickRuns.push({date:today,score:x.score,total:x.ids.length,ids:[...x.ids],finishedAt:now()});
 model.activeDrill=null;view='quick';save();render();return;
}
if(x.ids.length>=5){model.sessions[model.selectedDay]??={};model.sessions[model.selectedDay].quiz=true}
model.activeDrill=null;save();render()}

function practice(){const x=model.activeDrill,weak=getWeak(),due=reviewDue();if(!x)return `<div class="kicker">Learns from every answer</div><h1 class="page-title">Adaptive practice</h1><p class="lead">A ten-question practice set is chosen using your old baseline, new errors, low-confidence answers and spaced-review dates. Original mock questions remain locked until you complete that mock, preserving the value of a fresh exam.</p><div class="twocol"><div class="panel"><h3>Recommended focus</h3><p class="small muted">Want a surprise instead? <a href="#" onclick="startQuickQuiz();return false" class="link">Random 10-question quiz →</a></p><div class="topic-tabs">${weak.map(c=>`<button class="topic-tab ${model.selectedTopic===c?'selected':''}" onclick="selectFocus('${c}')">${c} · ${esc(TOPICS[c].title)}</button>`).join('')}</div><div class="actions"><button class="btn primary" onclick="startDrill('${model.selectedTopic||weak[0]}')">▶ Start 10 adaptive MCQs</button><button class="btn" onclick="startDrill('${weak[0]}')">Use top weakness</button><button class="btn" onclick="startDueDrill()" ${due.length?'':'disabled'}>Review due (${due.length})</button><button class="btn" onclick="startErrorDrill()" ${failuresAll()?'':'disabled'}>Retest mistakes (${failuresAll()})</button></div></div><div class="panel"><h3>Memory queue</h3><div class="metric-value">${due.length} <span class="muted small">due</span></div><div class="muted small">Correct + certain → review in 2, 4, 7 or 14 days. Wrong or unsure → review tomorrow.</div><div class="divider"></div><h3>Most important weak topics</h3>${weak.slice(0,4).map(c=>`<div class="row" style="margin:10px 0"><b>${c}</b><span class="muted small">${esc(TOPICS[c].title)}</span></div>`).join('')}</div></div>`;
if(x.index>=x.ids.length)return `<div class="kicker">Set finished</div><h1 class="page-title">${x.score}/${x.ids.length} correct</h1><div class="panel"><p>Today's practice is now recorded. Missed and uncertain items will come back sooner; confident correct items will return later.</p><button class="btn primary" onclick="finishDrill()">Save and return</button><button class="btn" onclick="startDrill('${x.focus}')">Try another set</button></div>`;
const q=QBY[x.ids[x.index]],answered=x.feedback;return `<div class="kicker">${x.focus==='random quiz'?'Random 10 quiz':'Adaptive session · '+esc(x.focus)+' focus'}</div><div class="row"><h1 class="page-title">Question ${x.index+1} of ${x.ids.length}</h1><span class="pill">${x.score} correct so far</span></div><div class="track" style="margin:15px 0 20px"><i style="width:${100*x.index/x.ids.length}%"></i></div><div class="twocol"><div class="questionbox"><span class="tag">${q.topic}</span><span class="muted small" style="float:right">${q.source==='Supplied UKSCA sample paper'?'Past question':'Original practice'}</span><div class="qtext">${esc(q.stem)}</div>${q.options.map((o,i)=>`<button class="option ${x.selected===i?'selected':''} ${answered&&i===q.correct?'correct':''} ${answered&&x.selected===i&&i!==q.correct?'incorrect':''}" onclick="answerDrillOpt(${i})" ${answered?'disabled':''}><b>${qletters[i]}</b><span>${esc(o)}</span></button>`).join('')}${answered?`<div class="feedback ${x.selected===q.correct?'':'bad'}"><b>${x.selected===q.correct?'✓ Correct':'✕ Not quite'} · Correct answer ${qletters[q.correct]}</b><div>${esc(q.why)}</div><p class="small">${esc(TOPICS[q.topic].book)}. Focus on why the three distractors are wrong.</p></div><div class="actions"><button class="btn primary" onclick="nextDrill()">${x.index===x.ids.length-1?'See set results':'Next question →'}</button><button class="btn ghost" onclick="openLesson('${q.topic}')">Study topic</button></div>`:`<div class="confrow"><b class="small">Confidence before feedback:</b>${[['sure','Certain'],['unsure','Unsure'],['guess','Guess']].map(([v,t])=>`<label><input type="radio" name="confidence" value="${v}" ${x.confidence===v?'checked':''} onchange="setDrillConfidence('${v}')"> ${t}</label>`).join('')}</div><button class="btn primary" onclick="submitDrill()" ${x.selected==null?'disabled':''}>Check answer</button>`}</div><div class="panel"><h3>Why these questions?</h3><p class="muted small">The mix dynamically prioritises uncertain or missed concepts, due memory items and your selected focus. Your new-answer history is used to update the dashboard immediately.</p><div class="divider"></div><h3>Closed-book thinking</h3><p class="muted">Choose the best answer, then state why another option is incorrect. Record your confidence before seeing feedback.</p><div class="divider"></div><button class="btn small ghost" onclick="quitDrill()">Save set and leave</button></div></div>`}
function selectFocus(c){model.selectedTopic=c;save();render()}
function quitDrill(){go('dashboard')}
function launchMock(p){if(model.activeMock&&model.activeMock.paper!==p&&!confirm('You have another unfinished mock. Replace it?'))return;if(model.activeMock?.paper!==p){model.activeMock={paper:p,answers:{},startedAt:now(),endAt:now()+60*60000};mockQuestionIdx=0;save()}view='mocks';render();window.scrollTo({top:0,behavior:'instant'})}
function mockTimeLeft(){return model.activeMock?Math.max(0,model.activeMock.endAt-now()):0}
function mockPick(n){mockQuestionIdx=n;render()}
function mockChoose(n){const x=model.activeMock;if(!x)return;const qid=DATA.mocks[x.paper].ids[mockQuestionIdx];x.answers[qid]=n;save();render()}
function endMock(){const x=model.activeMock;if(!x)return;const ids=DATA.mocks[x.paper].ids;const count=Object.keys(x.answers).length;if(count<50&&mockTimeLeft()>0&&!confirm(`You have answered ${count}/50. Mark remaining questions unanswered and submit?`))return;let score=0;let runId='run'+now();let wrong=[];for(const id of ids){let chosen=x.answers[id]??-1;const q=QBY[id];if(chosen===q.correct)score++;else wrong.push(id);addAttempt(id,chosen,'unsure','mock',runId)}model.mockRuns.push({id:runId,paper:x.paper,score,total:50,date:today,startedAt:x.startedAt,finishedAt:now(),wrong});model.activeMock=null;save();render();window.scrollTo({top:0,behavior:'instant'})}
function mockResult(run){const data=DATA.mocks[run.paper],all=run.wrong.map(id=>QBY[id]);const grouped={};for(const q of all){(grouped[q.topic]??=[]).push(q)}return `<div class="panel" style="margin-top:20px"><div class="row"><h3>${esc(data.name)} · ${run.score}/50</h3><span class="badge ${run.score>=43?'good':run.score>=33?'moderate':'danger'}">${fmtPct(run.score/50)}</span></div><p class="muted small">${run.score>=43?'Above your training target.':'Below the 43/50 personal target.'} ${data.kind==='fresh'?'New practice paper — useful but not exam-calibrated.':'Previously seen UKSCA sample paper: retake scores may be inflated by recall.'}</p>${Object.entries(grouped).map(([topic,qs])=>`<details style="padding:8px 0;border-top:1px solid var(--line)"><summary style="cursor:pointer"><b>${topic}</b> · ${qs.length} missed</summary>${qs.map(q=>`<div class="recall"><div class="small">${esc(q.stem)}</div><b>Correct: ${esc(q.options[q.correct])}</b><div class="muted small">${esc(q.why)}</div></div>`).join('')}<button class="btn small" onclick="openLesson('${topic}')">Revise ${topic}</button></details>`).join('')||'<div class="notice">All questions correct — excellent retrieval.</div>'}</div>`}
function mocksPage(){const x=model.activeMock;if(x){const ids=DATA.mocks[x.paper].ids,q=QBY[ids[mockQuestionIdx]],selected=x.answers[q.id],remain=mockTimeLeft(),answered=Object.keys(x.answers).length;return `<div class="row"><div><div class="kicker">Timed 50-question examination</div><h1 class="page-title">${esc(DATA.mocks[x.paper].name)}</h1></div><div class="timer" id="mockTimer">${Math.floor(remain/60000).toString().padStart(2,'0')}:${Math.floor(remain%60000/1000).toString().padStart(2,'0')}</div></div><div class="notice">Answer without checking sources. 60 minutes / 50 questions / target 43 correct. Auto-submission when your time runs out while the site is open.</div><div class="row" style="margin:16px 0"><span class="muted">${answered}/50 answered</span><span class="muted">Question ${mockQuestionIdx+1}/50</span></div><div class="track" style="margin-bottom:18px"><i style="width:${100*answered/50}%"></i></div><div class="twocol"><div class="questionbox"><span class="tag">${q.topic}</span><div class="qtext">${esc(q.stem)}</div>${q.options.map((s,i)=>`<button class="option ${selected===i?'selected':''}" onclick="mockChoose(${i})"><b>${qletters[i]}</b><span>${esc(s)}</span></button>`).join('')}<div class="row" style="margin-top:20px"><button class="btn" onclick="mockPick(${Math.max(0,mockQuestionIdx-1)})" ${mockQuestionIdx===0?'disabled':''}>← Previous</button><button class="btn primary" onclick="mockPick(${Math.min(49,mockQuestionIdx+1)})" ${mockQuestionIdx===49?'disabled':''}>Next →</button></div></div><div class="panel"><h3>Jump to question</h3><div class="qnav">${ids.map((id,j)=>`<button class="${x.answers[id]!==undefined?'answered':''} ${j===mockQuestionIdx?'current':''}" onclick="mockPick(${j})">${j+1}</button>`).join('')}</div><p class="muted small">Green boxes = answered; unfilled = unanswered. You can leave and resume; your timer continues.</p><div class="divider"></div><button class="btn primary" onclick="endMock()">Submit & mark /50</button><button class="btn ghost small" onclick="go('dashboard')">Leave and resume later</button></div></div>`}
return `<div class="kicker">Full exam practice</div><h1 class="page-title">8 × 50-question mocks</h1><p class="lead">Six original UKSCA-style practice exams (including four new ones) and two retakes of the uploaded sample papers. Full mocks take <b>60 minutes in addition</b> to the day's 45-minute core work. A score on an already-seen paper is not an unbiased measure of readiness.</p><div class="mock-grid">${Object.entries(DATA.mocks).sort((a,b)=>((PLAN.find(d=>d.extraMock===a[0])?.date||'')<(PLAN.find(d=>d.extraMock===b[0])?.date||'')?-1:1)).map(([p,m])=>{const runs=model.mockRuns.filter(x=>x.paper===p);const best=runs.length?Math.max(...runs.map(x=>x.score)):null;const date=PLAN.find(x=>x.extraMock===p)?.date;return `<div class="mockcard"><div class="mock-top"><span class="pill ${m.kind==='past'?'secondary':''}">${m.kind==='fresh'?'ORIGINAL · FRESH':'SUPPLIED · RETAKE'}</span><span class="muted small">60 MIN</span></div><div class="big" style="margin-top:16px">${esc(m.name)}</div><div class="muted small">Scheduled ${date}</div><p class="small muted">${esc(m.description)}</p><div class="row" style="margin-top:15px"><div class="metric-sub">${best===null?'Not attempted':`Best: ${best}/50`}</div><button class="btn primary small" onclick="launchMock('${p}')">${runs.length?'Retake mock':'Start mock'} →</button></div></div>`}).join('')}</div><div class="section-title"><h2>Mock score history & error reviews</h2></div>${model.mockRuns.length?[...model.mockRuns].reverse().map(mockResult).join(''):'<div class="panel empty">No mock results recorded yet. Your scores and question-level mistake review will appear here.</div>'}<div class="section-title"><h2>Your other historical papers</h2></div><div class="panel"><p class="muted">These are scans of two papers you already completed: 9 February 2019 (36/50) and 1 March 2020 (34/50). Open the PDFs and mark manually. They are available as historical revision evidence, not fresh mocks.</p><div class="actions"><a class="btn" target="_blank" href="resources/Feb 2019 Questions.pdf">February 2019 questions</a><a class="btn" target="_blank" href="resources/Feb 2019 Answers.pdf">Answer key</a><a class="btn" target="_blank" href="resources/March 2020 Questions.pdf">March 2020 questions</a><a class="btn" target="_blank" href="resources/March 2020 Answers.pdf">Answer key</a></div></div>`}
function downloadFile(filename,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportBackup(){downloadFile('UKSCA_progress_backup_'+today+'.json',JSON.stringify(model,null,2),'application/json')}
function importBackup(inp){const file=inp.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!Array.isArray(data.attempts)||!data.sessions||!Array.isArray(data.mockRuns))throw Error('Not a UKSCA progress file');if(!confirm('Replace progress on this browser with this backup?'))return;model=Object.assign(defaults(),data);save();render();alert('Backup restored successfully.')}catch(e){alert('Could not import backup: '+e.message)}};reader.readAsText(file)}
function downloadReport(){const rows=[['Date','Question','Competency','Correct','Confidence','Mode'],...model.attempts.map(a=>[a.date,a.qid,a.topic,a.correct?'Yes':'No',a.confidence,a.mode])];downloadFile('UKSCA_attempts_'+today+'.csv',rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')}
function documents(){return `<div class="kicker">Your private document shelf</div><h1 class="page-title">Books, UKSCA docs & your papers</h1><p class="lead">Everything opens from the downloadable website pack, including the exact third-edition textbook you supplied. PDFs launch in your browser and can be used without Wi-Fi.</p><div class="twocol"><div class="panel"><h3>Core study documents</h3>${[[ '📕','Essentials of Strength Training and Conditioning · 3rd ed.','Your uploaded NSCA textbook; chapter/page links also appear inside every lesson.','resources/Essentials of Strength Training and Conditioning 3.pdf'],['📋','UKSCA ASCC Competency Document','Your uploaded official competency document; use the Source of Evidence column to identify MCQ topics.','resources/UKSCA Competency Document.pdf'],['📃','UKSCA Sample Paper 1 · questions','Previously answered; 33/50 historical score.','resources/Sample 1 Questions.pdf'],['✅','UKSCA Sample Paper 1 · answers','Supplied answer key.','resources/Sample 1 Answers.pdf'],['📃','UKSCA Sample Paper 2 · questions','Previously answered; 30/50 historical score.','resources/Sample 2 Questions.pdf'],['✅','UKSCA Sample Paper 2 · answers','Supplied answer key.','resources/Sample 2 Answers.pdf'],['📃','UKSCA 9 Feb 2019 · questions','Your historical scanned paper (36/50).','resources/Feb 2019 Questions.pdf'],['✅','UKSCA 9 Feb 2019 · answers','Scanned answer key.','resources/Feb 2019 Answers.pdf'],['📃','UKSCA 1 Mar 2020 · questions','Your historical scanned paper (34/50).','resources/March 2020 Questions.pdf'],['✅','UKSCA 1 Mar 2020 · answers','Scanned answer key.','resources/March 2020 Answers.pdf']].map(([ic,name,desc,path])=>`<div class="resource"><div class="ic">${ic}</div><div><b>${esc(name)}</b><div class="muted small">${esc(desc)}</div><a class="small" href="${path}" target="_blank">Open PDF ↗</a></div></div>`).join('')}</div><div class="stack"><div class="panel"><h3>Official current guidance</h3><p class="muted small">These official online pages are for requirements that may change; they need internet access.</p><div class="resource"><div class="ic">🌐</div><div><b>UKSCA ASCC assessments</b><div class="muted small">Assessment pathway, resources and booking details.</div><a href="https://www.uksca.org.uk/assessments" target="_blank">Open official page ↗</a></div></div><div class="resource"><div class="ic">🌐</div><div><b>UKSCA Assessment Day Guidelines</b><div class="muted small">50 MCQs in 60 minutes; 65% pass threshold.</div><a href="https://cdn.uksca.org.uk/assets/pdfs/ASCCdocs/AssessmentDayGuidelines2022.pdf" target="_blank">Open official PDF ↗</a></div></div><div class="resource"><div class="ic">🌐</div><div><b>UKSCA FAQs</b><div class="muted small">The UKSCA notes that no one textbook covers all relevant material.</div><a href="https://www.uksca.org.uk/faq" target="_blank">Open official FAQ ↗</a></div></div></div><div class="panel"><h3>Your profile photo</h3><div class="row">${profilePhotoMarkup()}<div class="small muted">Upload the headshot from your LinkedIn profile once. It stays in this browser and is included in your progress backup.</div></div><div class="actions"><button class="btn primary" onclick="document.getElementById('photoDocs').click()">Choose profile picture</button><a class="btn" href="https://uk.linkedin.com/in/barny-wharin-b1095b29b" target="_blank" rel="noopener" style="text-decoration:none">Open your LinkedIn</a></div><input id="photoDocs" type="file" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="changeProfilePhoto(this)"></div><div class="panel"><h3>Keep your progress safe</h3><p class="muted small">The site learns your strengths and weaknesses in <b>this browser only</b>. It does not sync online. Export a backup weekly or before moving computers. Import it on another device to continue.</p><div class="actions"><button class="btn primary" onclick="exportBackup()">↓ Export progress</button><button class="btn" onclick="document.getElementById('fileImport').click()">↑ Import progress</button><button class="btn" onclick="downloadReport()">↓ Download question history</button><input style="display:none" id="fileImport" type="file" accept="application/json,.json" onchange="importBackup(this)"></div><div class="warnbox">Opening in an incognito/private window or clearing browser storage can erase local progress. Use the same browser and keep backups.</div></div><div class="panel"><h3>What the dashboard knows</h3><p class="muted small">It stores answers, correct/incorrect outcomes, confidence, revisits, mock and random quiz scores, reading checkboxes and your own lesson notes. It promotes missed material and schedules spaced retrieval. This is a personal training tool, not a validated pass-probability calculator.</p></div></div></div>`}

function profilePhotoMarkup(){if(typeof model.photo==='string' && /^data:image\/(jpeg|png|webp);base64,[a-z0-9+/=]+$/i.test(model.photo)) return `<img class="avatar" src="${model.photo}" alt="Barny's profile photo">`;return '<div class="avatar avatar-fallback" aria-label="Profile photo not set">BW</div>'}
function changeProfilePhoto(input){const file=input.files?.[0];if(!file)return;
if(!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size>8*1024*1024){alert('Please select a JPG, PNG or WebP image smaller than 8 MB.');return}
const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{
 const canvas=document.createElement('canvas');canvas.width=240;canvas.height=240;
 const ctx=canvas.getContext('2d');if(!ctx){alert('Unable to process this image.');return}
 const cut=Math.min(img.naturalWidth,img.naturalHeight),left=(img.naturalWidth-cut)/2,top=(img.naturalHeight-cut)/2;
 ctx.drawImage(img,left,top,cut,cut,0,0,240,240);model.photo=canvas.toDataURL('image/jpeg',.84);
 save();render();};img.onerror=()=>alert('This picture could not be loaded.');img.src=reader.result;};reader.readAsDataURL(file);
}
function quickPool(){return eligiblePool().filter(q=>q.kind==='quiz'||q.source==='Supplied UKSCA sample paper'||model.mockRuns.some(r=>r.paper===q.paper))}
function pickQuickIds(){const pool=quickPool(),seen=new Set(model.attempts.filter(a=>a.mode==='quick').map(a=>a.qid));
let available=pool.filter(q=>!seen.has(q.id));if(available.length<10){const recency=new Map();model.attempts.forEach((a,i)=>{if(a.mode==='quick')recency.set(a.qid,i)});available=[...pool].sort((a,b)=>(recency.get(a.id)??-1)-(recency.get(b.id)??-1))}
const ranked=available.map(q=>{const p=priority(q.topic),last=latest(q.id);let weight=Math.max(1,3+p/4);if(last&&!last.correct)weight*=1.6;if(last&&last.confidence!=='sure')weight*=1.2;return {q,key:Math.pow(Math.random(),1/weight)}}).sort((a,b)=>b.key-a.key);
const ids=[],count={};for(const x of ranked){if(ids.length>=10)break;if((count[x.q.topic]||0)>=3)continue;ids.push(x.q.id);count[x.q.topic]=(count[x.q.topic]||0)+1}
if(ids.length<10)for(const x of ranked){if(ids.length===10)break;if(!ids.includes(x.q.id))ids.push(x.q.id)}
return ids;}
function startQuickQuiz(){const ids=pickQuickIds();if(ids.length!==10){alert('Question bank is unavailable.');return}setDrill(ids,'random quiz');view='quick';render();}
function quickPage(){if(model.activeDrill?.focus==='random quiz')return practice();const runs=model.quickRuns||[],pool=quickPool(),seen=new Set(model.attempts.filter(x=>x.mode==='quick').map(x=>x.qid)),last=runs.slice(-8).reverse();
return `<div class="kicker">Anytime · no schedule required</div><h1 class="page-title">Random 10-question quiz</h1><p class="lead">Ten questions sampled from a large, topic-balanced pool. Unseen questions come first, with no repeats until the pool is nearly exhausted. Mistakes and confidence ratings feed straight into your adaptive knowledge map.</p>
<div class="fourcol">${metric('Available now',pool.length,'Original quiz items + seen papers',null)}${metric('New to you',pool.filter(q=>!seen.has(q.id)).length,'Not previously used in random quizzes',null)}${metric('Quick quizzes finished',runs.length,'Every result retained',null)}${metric('Most recent',runs.length?runs[runs.length-1].score+'/10':'—','Self-test score',null)}</div>
<div class="panel" style="margin:20px 0"><h3>Ready for ten fresh questions?</h3><p class="muted">Typically 6–10 minutes. See explanations after each response; record whether you were certain, unsure or guessing. No unanswered new mock questions are exposed.</p><button class="btn primary" onclick="startQuickQuiz()">▶ Start random 10-question quiz</button></div>
<div class="section-title"><h2>Your recent quick quizzes</h2></div><div class="panel">${last.length?`<table class="table"><thead><tr><th>Date</th><th>Score</th><th>Questions</th></tr></thead><tbody>${last.map((r)=>`<tr><td>${esc(r.date)}</td><td><b>${r.score}/${r.total}</b></td><td>${r.ids.length} recorded</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Take your first quiz to start tracking scores.</div>'}</div>`}

function updateTimer(){const e=document.getElementById('mockTimer');if(e&&model.activeMock){const r=mockTimeLeft();e.textContent=String(Math.floor(r/60000)).padStart(2,'0')+':'+String(Math.floor(r%60000/1000)).padStart(2,'0');if(r<=0){endMock()}}}
setInterval(updateTimer,1000);render();

</script><script src="hosted-documents.js"></script></body></html>
